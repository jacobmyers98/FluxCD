apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: waffle-lb-pool
spec:
  blocks:
  - start: "192.168.1.254"
    stop: "192.168.1.254"

---

apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: waffle-l2-policy
spec:
  # This tells Cilium to announce these IPs on all Linux nodes in your cluster
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/os
        operator: In
        values:
          - linux
  externalIPs: true
  loadBalancerIPs: true

  # ensure you have the following on your cilium values
  # --set l2announcements.enabled=true
  # --set bgpControlPlane.enabled=false
  # --set ingressController.service.externalTrafficPolicy=Cluster