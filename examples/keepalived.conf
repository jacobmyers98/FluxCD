#/etc/keepalived/keepalived.conf

vrrp_script chk_haproxy {
  script "/usr/bin/pgrep haproxy"
  interval 2
  weight 2
}

vrrp_instance VI_1 {
  state BACKUP
  interface eth0
  virtual_router_id 51
  priority 100
  advert_int 1

  authentication {
    auth_type PASS
    auth_pass k8s
  }

  virtual_ipaddress {
    10.0.0.100/24
  }

  track_script {
    chk_haproxy
  }
}
