#/etc/keepalived/keepalived.conf

vrrp_script chk_haproxy {
  script "/usr/bin/pgrep haproxy"
  interval 2
  weight 2
}

vrrp_instance VI_1 {
  state BACKUP
  interface eth0
  virtual_router_id 51
  priority 100
  advert_int 1

  authentication {
    auth_type PASS
    auth_pass k8s
  }

# put in your private IP subnet but differ from the --pod-network-cidr
  virtual_ipaddress {
    192.168.1.253/24
  }

  track_script {
    chk_haproxy
  }
}
