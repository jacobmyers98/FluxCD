# cert-manager: gets and renews TLS certificates automatically.
# Flow: an Ingress with the annotation cert-manager.io/cluster-issuer: letsencrypt-prod
# (or a Certificate object) → cert-manager asks Let's Encrypt → proves we own the domain
# with a DNS-01 challenge (creates a TXT record through the Cloudflare API) → stores the
# cert in a Secret the Ingress uses → renews it ~30 days before it expires.
# The ClusterIssuer is in cluster-issuer.yaml, the Cloudflare token in secret.cloudflare-token.yaml,
# and the Ingresses in ingresses.yaml (all in apps/network/).
# Check certificates:  kubectl get certificate -A     (READY should be True)
#
# A HelmRelease = "install this Helm chart with these values and keep it that way";
# Flux's helm-controller does the `helm install/upgrade` for you.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  releaseName: cert-manager   # name of the Helm release (`helm -n kube-system list`)
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      version: ">=v1.14.0"      # no upper limit: new majors install automatically (live: v1.21.3). FLUX_TODO.md #2
  interval: 1h                # how often Flux checks the release
  install:
    createNamespace: true
    crds: CreateReplace       # only affects charts with a crds/ folder; cert-manager renders its CRDs as templates (crds.enabled below), so no effect here
  values:
    # Have the chart render its CRDs as normal templates so upgrades update them too.
    # keep = the CRDs get helm.sh/resource-policy: keep, so uninstalling the release never
    # deletes them (that would delete every Certificate and Issuer with them).
    # (Was `installCRDs: true`, the pre-1.15 name for the same thing; same render, checked 2026-11-17.)
    crds:
      enabled: true
      keep: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    webhook:                  # admission webhook: validates Certificate/Issuer objects when they're applied
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    cainjector:               # fills CA bundles into webhooks/CRDs (memory grows with the number of objects it watches)
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 512Mi
