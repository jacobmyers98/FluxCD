# Cilium network policies: which pods may talk to which.
#
# How Cilium policies work (short version):
#   - A pod with NO policy selecting it can talk to anything and be reached by anything.
#   - As soon as one policy selects a pod (endpointSelector) for a direction (ingress =
#     incoming, egress = outgoing), that direction becomes "deny unless allowed": only
#     traffic matching some rule in some policy gets through. Rules from several policies
#     add up (they can only allow, never block on their own).
#   - fromEndpoints / toEndpoints match pods by label; fromEntities / toEntities match
#     special groups: world (internet + LAN outside the cluster), host (the node itself),
#     ingress (Cilium's Ingress/Envoy proxy), cluster (all pods), kube-apiserver.
#   - Labels with "k8s:io.kubernetes.pod.namespace" select the pod's namespace.
#   - authentication.mode: required = the two pods must also prove who they are with
#     mutual TLS (identities from SPIRE, namespace cilium-spire). See README.
#
# 1-3: deny-all in the namespaces no workload should use. `ingress: [{}]` and
# `egress: [{}]` are rules that match nothing, so every pod there is fully isolated.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: deny-all
  namespace: default
spec:
  endpointSelector: {}
  ingress:
  - {}
  egress:
  - {}

---

apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: deny-all
  namespace: kube-public
spec:
  endpointSelector: {}
  ingress:
  - {}
  egress:
  - {}

---

apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: deny-all
  namespace: kube-node-lease
spec:
  endpointSelector: {}
  ingress:
  - {}
  egress:
  - {}

---

# 4: mTLS everywhere (cluster-wide). Selects every pod except those in kube-system /
# cilium-spire / flux-system / kubevirt and except pods labelled exposed=nodeport.
# It allows incoming traffic from any pod in the cluster, but only with mutual TLS.
# Side effect: every selected pod becomes "deny incoming unless allowed", so outside
# traffic (Ingress, LAN, Tailscale) needs an extra rule in a namespace policy below.
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "default-require-mtls"
spec:
  description: "Require mTLS globally for Pods, ignoring reserved Cilium identities"
  endpointSelector:
    matchExpressions:
    - key: "k8s:io.kubernetes.pod.namespace"
      operator: Exists
    - key: "k8s:io.kubernetes.pod.namespace"
      operator: NotIn
      values:
      - kube-system
      - cilium-spire
      - flux-system
      - kubevirt
    - key: "exposed"
      operator: NotIn
      values:
      - nodeport
  ingress:
  - fromEndpoints:
    - matchLabels: {}
    authentication:
      mode: "required"
# default blanket mTLS for everything except those 4 namespaces, and externally exposed apps (exposed=nodeport)

---

# 5: pods labelled exposed=nodeport (apps reached directly on a NodePort: today Plex,
# Minecraft, Vaultwarden and Tailscale; the others go through the HTTPS Ingress since 2026-11-17) may receive traffic from anywhere: internet/LAN, the node, the
# Ingress, other pods, the API server. These are left out of the mTLS rule above,
# because traffic arriving through a NodePort can't do mTLS.
# "world" must stay: NodePort clients (LAN, Plex's outside users) arrive as world (tested 2026-11-27:
# without it Plex 30013 and Vaultwarden 30009 stop answering from the LAN).
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-external-nodeport
spec:
  endpointSelector:
    matchLabels:
      exposed: nodeport
  ingress:
  - fromEntities:
    - world
    - host
    - ingress
    - cluster
    - kube-apiserver
# blanket policy to allow nodeport to reach world and host

---

# 6: plex namespace. Media apps may talk to each other (with mTLS), and be reached from
# the node, the Ingress, Homarr (dashboard widgets) and Tailscale, on the apps' own ports.
# No "world" in: browsers come through the Ingress, Plex's NodePort (outside users) is policy #5
# (Plex is exposed=nodeport), and torrent peers reach qBittorrent inside its VPN tunnel.
# Outgoing: each other, DNS, Homarr and Tailscale. Internet access is policy #6b, which leaves
# Tdarr out (it only transcodes local files).
# A new app in this namespace must be added to BOTH "app" lists (and to #6b if it needs the internet).
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: plex-stack-ingress
  namespace: plex
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - plex
      - qbittorrent
      - prowlarr
      - radarr
      - sonarr
      - tdarr-node
      - tdarr-server
      - seerr
  ingress:
  - fromEndpoints:
    - matchExpressions:
      - key: "app"
        operator: In
        values:
          - plex
          - qbittorrent
          - prowlarr
          - radarr
          - sonarr
          - tdarr-node
          - tdarr-server
          - seerr
    authentication:
      mode: "required"
  # only the apps' own ports (a sidecar port, e.g. gluetun's control server, stays closed)
  - fromEntities:
    - host
    - ingress
    toPorts:
    - ports:
      - port: "32400" # Plex
        protocol: TCP
      - port: "8080" # qBittorrent web UI
        protocol: TCP
      - port: "34567" # qBittorrent torrent port (TCP + UDP)
        protocol: ANY
      - port: "9696" # Prowlarr
        protocol: TCP
      - port: "7878" # Radarr
        protocol: TCP
      - port: "8989" # Sonarr
        protocol: TCP
      - port: "5055" # Seerr
        protocol: TCP
      - port: "8265" # Tdarr web UI
        protocol: TCP
      - port: "8266" # Tdarr server (nodes connect here)
        protocol: TCP
      - port: "8267" # Tdarr node
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: infrastructure
        app: homarr
    toPorts:
    - ports:
      - port: "32400" # Plex
        protocol: TCP
      - port: "8080" # qBittorrent web UI
        protocol: TCP
      - port: "34567" # qBittorrent torrent port (TCP + UDP)
        protocol: ANY
      - port: "9696" # Prowlarr
        protocol: TCP
      - port: "7878" # Radarr
        protocol: TCP
      - port: "8989" # Sonarr
        protocol: TCP
      - port: "5055" # Seerr
        protocol: TCP
      - port: "8265" # Tdarr web UI
        protocol: TCP
      - port: "8266" # Tdarr server (nodes connect here)
        protocol: TCP
      - port: "8267" # Tdarr node
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        app: tailscale
    toPorts:
    - ports:
      - port: "32400" # Plex
        protocol: TCP
      - port: "8080" # qBittorrent web UI
        protocol: TCP
      - port: "34567" # qBittorrent torrent port (TCP + UDP)
        protocol: ANY
      - port: "9696" # Prowlarr
        protocol: TCP
      - port: "7878" # Radarr
        protocol: TCP
      - port: "8989" # Sonarr
        protocol: TCP
      - port: "5055" # Seerr
        protocol: TCP
      - port: "8265" # Tdarr web UI
        protocol: TCP
      - port: "8266" # Tdarr server (nodes connect here)
        protocol: TCP
      - port: "8267" # Tdarr node
        protocol: TCP
  egress:
    - toEndpoints:
      - matchExpressions:
        - key: "app"
          operator: In
          values:
          - plex
          - qbittorrent
          - prowlarr
          - radarr
          - sonarr
          - tdarr-node
          - tdarr-server
          - seerr
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          k8s-app: kube-dns
      toPorts:
      - ports:
        - port: "53"
          protocol: ANY
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: infrastructure
          app: homarr
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          app: tailscale

---

# 6b: internet access for the plex apps that need it (tested 2026-11-27: without it they all lose
# the internet): Plex (plex.tv, metadata), qBittorrent (its VPN server; gluetun sends everything
# through the tunnel), Prowlarr (indexers), Radarr/Sonarr (metadata), Seerr (TMDB). Tdarr isn't
# listed: it opens every downloaded file, so a hacked Tdarr can't phone home or upload media.
# "world" also includes the LAN (192.168.x.x); qBittorrent is kept off it by gluetun's firewall.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: plex-internet-egress
  namespace: plex
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - plex
      - qbittorrent
      - prowlarr
      - radarr
      - sonarr
      - seerr
  egress:
    - toEntities:
      - world
---

# 7: monitoring namespace (the listed apps only; Prometheus/Loki/etc. aren't selected).
# Incoming: each other (mTLS), the Ingress, Homarr (namespace infrastructure since 2026-11-26),
# Tailscale and n8n.
# Outgoing: DNS, Prometheus (9090), Loki (3100), Alertmanager (9093), Postgres (5432) and
# Mosquitto (1883) in monitoring, Tailscale, n8n, and the listed ports anywhere in the
# cluster or outside. (Homarr, Mealie and SnapOtter moved to infrastructure, policy #10.)
# A new app here must be added to both "app" lists, or it can't be reached.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-stack-ingress
  namespace: monitoring
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - grafana
      - teslamate
      - glances
  ingress:
  - fromEndpoints:
    - matchExpressions:
      - key: "app"
        operator: In
        values:
        - grafana
        - teslamate
        - glances
    authentication:
      mode: "required"
  - fromEntities:
    - ingress
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: infrastructure
        app: homarr
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        app: tailscale
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: dev
        app: n8n
  egress:
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          k8s-app: kube-dns
      toPorts:
      - ports:
        - port: "53"
          protocol: ANY
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
      - ports:
        - port: "9090" # Prometheus
          protocol: TCP
        - port: "3100" # Loki
          protocol: TCP
        - port: "9093" # Alertmanager (Grafana datasource)
          protocol: TCP
        - port: "5432" # TeslaMate's Postgres (TeslaMate, Grafana's TeslaMate datasource)
          protocol: TCP
        - port: "1883" # Mosquitto (TeslaMate)
          protocol: TCP
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          app: tailscale
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: dev
          app: n8n
    # Internet (and LAN): web only. Grafana plugins/updates, TeslaMate's Tesla API (443).
    - toEntities:
      - world
      toPorts:
      - ports:
        - port: "80"
          protocol: TCP
        - port: "443"
          protocol: TCP
    # Other pods only: the old Homarr widget ports (harmless to keep)
    - toEntities:
      - cluster # Allows traffic to other namespaces (e.g., your 'gaming' namespace)
      toPorts:
      - ports:
        - port: "80"
          protocol: TCP
        - port: "443"
          protocol: TCP
        - port: "25575" # minecraft
          protocol: TCP
        - port: "25565" # minecraft
          protocol: TCP
        - port: "8989" # Sonarr
          protocol: TCP
        - port: "7878" # Radarr
          protocol: TCP
        - port: "32400" # Plex
          protocol: TCP
        - port: "8080" # Qbit
          protocol: TCP
        - port: "9696" # Prowlar
          protocol: TCP
        - port: "8265" # Tdarr
          protocol: TCP
        - port: "61208" # Glances
          protocol: TCP
        - port: "3000" # Grafana
          protocol: TCP
        - port: "5055" # Seerr (Homarr app tile ping; missing it made the dashboard wait 10 s)
          protocol: TCP
        - port: "1349" # SnapOtter (same)
          protocol: TCP

---

# 8: gaming namespace (Minecraft). Incoming: players on 25565 from the internet/LAN and
# the Ingress, Homarr on 25565 + RCON 25575 (server status widget), and Tailscale.
# Outgoing: DNS, internet on 80/443 (Mojang login, mod downloads), Homarr, Tailscale.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: gaming-stack-ingress
  namespace: gaming
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - minecraft
  ingress:
  # "world" stays: players connect to NodePort 30016, and the Minecraft pod isn't exposed=nodeport (policy #5)
  - fromEntities:
    - world
    - ingress
    toPorts:
      - ports:
        - port: "25565"
          protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: infrastructure
        app: homarr
    toPorts:
      - ports:
        - port: "25565" 
          protocol: ANY
        - port: "25575" # RCON port
          protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        app: tailscale
  egress:
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          k8s-app: kube-dns
      toPorts:
      - ports:
        - port: "53"
          protocol: ANY   
    # Allow outbound to Mojang for player authentication
    - toEntities:
      - world
      toPorts:
      - ports:
        - port: "443"
          protocol: TCP
        - port: "80" 
          protocol: TCP
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: infrastructure
          app: homarr
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          app: tailscale

---

# 9: dev namespace, n8n pods only (the other dev apps aren't selected here; the
# backtester has its own NetworkPolicies in apps/dev/backtest). Incoming: internet/LAN,
# node and Ingress (forms, webhooks, UI), Homarr and Mealie (infrastructure; Mealie calls Ollama in the n8n pod),
# Tailscale, and the backtest API on 5678 only (run-finished callbacks).
# No egress rules, so n8n's outgoing traffic is not restricted.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: dev-stack-ingress
  namespace: dev
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - n8n
  ingress:
  # "world" stays for NodePort 30018 (forms/links by IP from the LAN; tested 2026-11-27: without it
  # http://192.168.1.200:30018 stops answering). Drop it once nothing uses the IP address.
  - fromEntities:
    - world
    - host
    - ingress
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: infrastructure
        app: homarr
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: infrastructure
        app: mealie
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        app: tailscale
  # backtest-api posts finished runs to n8n's webhooks
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: dev
        app.kubernetes.io/name: backtester
        app.kubernetes.io/component: api
    toPorts:
    - ports:
      - port: "5678"
        protocol: TCP

---

# 10: infrastructure namespace: Homarr, Mealie, SnapOtter (moved here from monitoring 2026-11-26).
# Vaultwarden isn't selected: it's exposed=nodeport (policy #5, open in, unrestricted out).
# Incoming: each other (mTLS), the Ingress, Tailscale and n8n.
# Outgoing: DNS, any pod in infrastructure (Homarr's tile pings to Immich/SnapOtter/Mealie),
# Ollama in dev (Mealie's AI), Tailscale, n8n, and the listed ports anywhere in the cluster or
# outside (Homarr's widgets poll the other apps; Mealie scrapes recipe sites over 80/443).
# A new app here must be added to both "app" lists; a new Homarr target port to the egress list.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: infrastructure-stack-ingress
  namespace: infrastructure
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - homarr
      - mealie
      - snapotter
  ingress:
  - fromEndpoints:
    - matchExpressions:
      - key: "app"
        operator: In
        values:
        - homarr
        - mealie
        - snapotter
    authentication:
      mode: "required"
  - fromEntities:
    - ingress
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        app: tailscale
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: dev
        app: n8n
  egress:
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          k8s-app: kube-dns
      toPorts:
      - ports:
        - port: "53"
          protocol: ANY
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: infrastructure
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: dev
      toPorts:
      - ports:
        - port: "11434" # Ollama (Mealie's AI)
          protocol: TCP
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          app: tailscale
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: dev
          app: n8n
    # Internet (and LAN): web only. Mealie recipe scraping, Homarr's weather widget, SnapOtter model downloads.
    - toEntities:
      - world
      toPorts:
      - ports:
        - port: "80"
          protocol: TCP
        - port: "443"
          protocol: TCP
    # Homarr API / dashboard connections to the other apps (in-cluster Service names)
    - toEntities:
      - cluster
      toPorts:
      - ports:
        - port: "80"
          protocol: TCP
        - port: "443"
          protocol: TCP
        - port: "25575" # minecraft RCON
          protocol: TCP
        - port: "25565" # minecraft
          protocol: TCP
        - port: "8989" # Sonarr
          protocol: TCP
        - port: "7878" # Radarr
          protocol: TCP
        - port: "32400" # Plex
          protocol: TCP
        - port: "8080" # Qbit
          protocol: TCP
        - port: "9696" # Prowlarr
          protocol: TCP
        - port: "8265" # Tdarr
          protocol: TCP
        - port: "61208" # Glances (monitoring)
          protocol: TCP
        - port: "3000" # Grafana (monitoring)
          protocol: TCP
        - port: "5055" # Seerr
          protocol: TCP

---

# 11: Immich web server (the chart labels every Immich pod app=immich; this selects only the
# server). Incoming: the Ingress, Tailscale and Homarr. Immich's own pods (server ↔ ML ↔ valkey ↔
# Postgres) reach each other through policy #4 (any pod, with mTLS). No egress rules: the server
# fetches map tiles / version checks and ML downloads models from Hugging Face.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: immich-ingress
  namespace: infrastructure
spec:
  endpointSelector:
    matchLabels:
      app: immich
      app.kubernetes.io/name: server
  ingress:
  - fromEntities:
    - ingress
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        app: tailscale
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: infrastructure
        app: homarr
    toPorts:
    - ports:
      - port: "2283"
        protocol: TCP
