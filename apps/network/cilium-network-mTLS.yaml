# Cilium network policies: which pods may talk to which.
#
# How Cilium policies work (short version):
#   - A pod with NO policy selecting it can talk to anything and be reached by anything.
#   - As soon as one policy selects a pod (endpointSelector) for a direction (ingress =
#     incoming, egress = outgoing), that direction becomes "deny unless allowed": only
#     traffic matching some rule in some policy gets through. Rules from several policies
#     add up (they can only allow, never block on their own).
#   - fromEndpoints / toEndpoints match pods by label; fromEntities / toEntities match
#     special groups: world (internet + LAN outside the cluster), host (the node itself),
#     ingress (Cilium's Ingress/Envoy proxy), cluster (all pods), kube-apiserver.
#   - Labels with "k8s:io.kubernetes.pod.namespace" select the pod's namespace.
#   - authentication.mode: required = the two pods must also prove who they are with
#     mutual TLS (identities from SPIRE, namespace cilium-spire). See README.
#
# 1-3: deny-all in the namespaces no workload should use. `ingress: [{}]` and
# `egress: [{}]` are rules that match nothing, so every pod there is fully isolated.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: deny-all
  namespace: default
spec:
  endpointSelector: {}
  ingress:
  - {}
  egress:
  - {}

---

apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: deny-all
  namespace: kube-public
spec:
  endpointSelector: {}
  ingress:
  - {}
  egress:
  - {}

---

apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: deny-all
  namespace: kube-node-lease
spec:
  endpointSelector: {}
  ingress:
  - {}
  egress:
  - {}

---

# 4: mTLS everywhere (cluster-wide). Selects every pod except those in kube-system /
# cilium-spire / flux-system / kubevirt and except pods labelled exposed=nodeport.
# It allows incoming traffic from any pod in the cluster, but only with mutual TLS.
# Side effect: every selected pod becomes "deny incoming unless allowed", so outside
# traffic (Ingress, LAN, Tailscale) needs an extra rule in a namespace policy below.
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "default-require-mtls"
spec:
  description: "Require mTLS globally for Pods, ignoring reserved Cilium identities"
  endpointSelector:
    matchExpressions:
    - key: "k8s:io.kubernetes.pod.namespace"
      operator: Exists
    - key: "k8s:io.kubernetes.pod.namespace"
      operator: NotIn
      values:
      - kube-system
      - cilium-spire
      - flux-system
      - kubevirt
    - key: "exposed"
      operator: NotIn
      values:
      - nodeport
  ingress:
  - fromEndpoints:
    - matchLabels: {}
    authentication:
      mode: "required"
# default blanket mTLS for everything except those 4 namespaces, and externally exposed apps (exposed=nodeport)

---

# 5: pods labelled exposed=nodeport (apps reached directly on a NodePort: today Plex,
# Minecraft, Vaultwarden and Tailscale; the others go through the HTTPS Ingress since 2026-11-17) may receive traffic from anywhere: internet/LAN, the node, the
# Ingress, other pods, the API server. These are left out of the mTLS rule above,
# because traffic arriving through a NodePort can't do mTLS.
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-external-nodeport
spec:
  endpointSelector:
    matchLabels:
      exposed: nodeport
  ingress:
  - fromEntities:
    - world
    - host
    - ingress
    - cluster
    - kube-apiserver
# blanket policy to allow nodeport to reach world and host

---

# 6: plex namespace. Media apps may talk to each other (with mTLS), and be reached from
# the internet/LAN, the node, the Ingress, Homarr (dashboard widgets) and Tailscale.
# Outgoing: each other, DNS, Homarr, Tailscale and the whole internet (indexers,
# metadata, VPN). A new app in this namespace must be added to BOTH "app" lists.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: plex-stack-ingress
  namespace: plex
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - plex
      - qbittorrent
      - prowlarr
      - radarr
      - sonarr
      - tdarr-node
      - tdarr-server
      - seerr
  ingress:
  - fromEndpoints:
    - matchExpressions:
      - key: "app"
        operator: In
        values:
        - plex
        - qbittorrent
        - prowlarr
        - radarr
        - sonarr
        - tdarr-node
        - tdarr-server
        - seerr
    authentication:
      mode: "required"
  - fromEntities:
    - world
    - host
    - ingress
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app: homarr
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        app: tailscale
  egress:
    - toEndpoints:
      - matchExpressions:
        - key: "app"
          operator: In
          values:
          - plex
          - qbittorrent
          - prowlarr
          - radarr
          - sonarr
          - tdarr-node
          - tdarr-server
          - seerr
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          k8s-app: kube-dns
      toPorts:
      - ports:
        - port: "53"
          protocol: ANY
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: monitoring
          app: homarr
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          app: tailscale
    - toEntities:
      - world

---

# 7: monitoring namespace (the listed apps only; Prometheus/Loki/etc. aren't selected).
# Incoming: each other (mTLS), the Ingress, Homarr, Tailscale and n8n.
# Outgoing: DNS, Prometheus (9090), Loki (3100), Alertmanager (9093), Postgres (5432) and
# Mosquitto (1883) in monitoring, Ollama in dev (11434, Mealie's AI),
# Tailscale, n8n, and the listed ports anywhere in the cluster or outside (Homarr's
# widgets poll the other apps; Mealie scrapes recipe sites over 80/443).
# A new app here must be added to both "app" lists, or it can't be reached.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-stack-ingress
  namespace: monitoring
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - mealie
      - grafana
      - teslamate
      - homarr
      - snapotter
      - glances
  ingress:
  - fromEndpoints:
    - matchExpressions:
      - key: "app"
        operator: In
        values:
        - mealie
        - grafana
        - teslamate
        - homarr
        - snapotter
        - glances
    authentication:
      mode: "required"
  - fromEntities:
    - ingress
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app: homarr
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        app: tailscale
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: dev
        app: n8n
  egress:
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          k8s-app: kube-dns
      toPorts:
      - ports:
        - port: "53"
          protocol: ANY
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
      - ports:
        - port: "9090" # Prometheus
          protocol: TCP
        - port: "3100" # Loki
          protocol: TCP
        - port: "9093" # Alertmanager (Grafana datasource)
          protocol: TCP
        - port: "5432" # TeslaMate's Postgres (TeslaMate, Grafana's TeslaMate datasource)
          protocol: TCP
        - port: "1883" # Mosquitto (TeslaMate)
          protocol: TCP
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: dev
      toPorts:
      - ports:
        - port: "11434" # ollama
          protocol: TCP
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          app: tailscale
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: dev
          app: n8n
    # Homarr API / Dashboard Connections
    - toEntities:
      - cluster # Allows traffic to other namespaces (e.g., your 'gaming' namespace)
      - world   # Allows traffic to the internet AND your local external LAN (192.168.x.x)
      toPorts:
      - ports:
        - port: "80"
          protocol: TCP
        - port: "443"
          protocol: TCP
        - port: "25575" # minecraft
          protocol: TCP
        - port: "25565" # minecraft
          protocol: TCP
        - port: "8989" # Sonarr
          protocol: TCP
        - port: "7878" # Radarr
          protocol: TCP
        - port: "32400" # Plex
          protocol: TCP
        - port: "8080" # Qbit
          protocol: TCP
        - port: "9696" # Prowlar
          protocol: TCP
        - port: "8265" # Tdarr
          protocol: TCP
        - port: "61208" # Glances
          protocol: TCP
        - port: "3000" # Grafana
          protocol: TCP

---

# 8: gaming namespace (Minecraft). Incoming: players on 25565 from the internet/LAN and
# the Ingress, Homarr on 25565 + RCON 25575 (server status widget), and Tailscale.
# Outgoing: DNS, internet on 80/443 (Mojang login, mod downloads), Homarr, Tailscale.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: gaming-stack-ingress
  namespace: gaming
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - minecraft
  ingress:
  - fromEntities:
    - world
    - ingress
    toPorts:
      - ports:
        - port: "25565"
          protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app: homarr
    toPorts:
      - ports:
        - port: "25565" 
          protocol: ANY
        - port: "25575" # RCON port
          protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        app: tailscale
  egress:
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          k8s-app: kube-dns
      toPorts:
      - ports:
        - port: "53"
          protocol: ANY   
    # Allow outbound to Mojang for player authentication
    - toEntities:
      - world
      toPorts:
      - ports:
        - port: "443"
          protocol: TCP
        - port: "80" 
          protocol: TCP
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: monitoring
          app: homarr
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          app: tailscale

---

# 9: dev namespace, n8n pods only (the other dev apps aren't selected here; the
# backtester has its own NetworkPolicies in apps/dev/backtest). Incoming: internet/LAN,
# node and Ingress (forms, webhooks, UI), Homarr, Mealie (calls Ollama in the n8n pod),
# Tailscale, and the backtest API on 5678 only (run-finished callbacks).
# No egress rules, so n8n's outgoing traffic is not restricted.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: dev-stack-ingress
  namespace: dev
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - n8n
  ingress:
  - fromEntities:
    - world
    - host
    - ingress
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app: homarr
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app: mealie
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        app: tailscale
  # backtest-api posts finished runs to n8n's webhooks
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: dev
        app.kubernetes.io/name: backtester
        app.kubernetes.io/component: api
    toPorts:
    - ports:
      - port: "5678"
        protocol: TCP
