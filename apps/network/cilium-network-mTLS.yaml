apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "default-require-mtls"
spec:
  description: "Require mTLS globally for Pods, ignoring reserved Cilium identities"
  endpointSelector:
    matchExpressions:
    - key: "k8s:io.kubernetes.pod.namespace"
      operator: Exists
    - key: "k8s:io.kubernetes.pod.namespace"
      operator: NotIn
      values:
      - kube-system
      - cilium-spire
      - flux-system
      - kubevirt
    - key: "exposed"
      operator: NotIn
      values:
      - nodeport
  ingress:
  - fromEndpoints:
    - matchLabels: {}
    authentication:
      mode: "required"
# default blanket mTLS for everything except those 3 namespaces, and =externally exposed apps exposed=nodeport

---

apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-external-nodeport
spec:
  endpointSelector:
    matchLabels:
      exposed: nodeport
  ingress:
  - fromEntities:
    - world
    - host
    - ingress
    - cluster
    - kube-apiserver
# blanket policy to allow nodeport to reach world and host

---

apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: plex-stack-ingress
  namespace: plex
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - plex
      - qbittorrent
      - prowlarr
      - radarr
      - sonarr
      - tdarr-node
      - tdarr-server
      - requestrr
      - seerr
  ingress:
  - fromEndpoints:
    - matchExpressions:
      - key: "app"
        operator: In
        values:
        - plex
        - qbittorrent
        - prowlarr
        - radarr
        - sonarr
        - tdarr-node
        - tdarr-server
        - requestrr
        - seerr
    authentication:
      mode: "required"
  - fromEntities:
    - world
    - host
    - ingress
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app: homarr
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        app: tailscale
  egress:
    - toEndpoints:
      - matchExpressions:
        - key: "app"
          operator: In
          values:
          - plex
          - qbittorrent
          - prowlarr
          - radarr
          - sonarr
          - tdarr-node
          - tdarr-server
          - requestrr
          - seerr
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          k8s-app: kube-dns
      toPorts:
      - ports:
        - port: "53"
          protocol: ANY
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: monitoring
          app: homarr
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          app: tailscale
    - toEntities:
      - world

---

apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-stack-ingress
  namespace: monitoring
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - grafana
      - teslamate
      - homarr
      - snapotter
      - glances
  ingress:
  - fromEndpoints:
    - matchExpressions:
      - key: "app"
        operator: In
        values:
        - grafana
        - teslamate
        - homarr
        - snapotter
        - glances
    authentication:
      mode: "required"
  - fromEntities:
    - ingress
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app: homarr
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        app: tailscale
  egress:
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          k8s-app: kube-dns
      toPorts:
      - ports:
        - port: "53"
          protocol: ANY
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
      - ports:
        - port: "9090" # Prometheus
          protocol: TCP
        - port: "3100" # Loki
          protocol: TCP
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          app: tailscale
    # Homarr API / Dashboard Connections
    - toEntities:
      - cluster # Allows traffic to other namespaces (e.g., your 'gaming' namespace)
      - world   # Allows traffic to the internet AND your local external LAN (192.168.x.x)
      toPorts:
      - ports:
        - port: "80"
          protocol: TCP
        - port: "443"
          protocol: TCP
        - port: "25575" # minecraft
          protocol: TCP
        - port: "25565" # minecraft
          protocol: TCP
        - port: "8989" # Sonarr
          protocol: TCP
        - port: "7878" # Radarr
          protocol: TCP
        - port: "32400" # Plex
          protocol: TCP
        - port: "8080" # Qbit
          protocol: TCP
        - port: "9696" # Prowlar
          protocol: TCP
        - port: "8265" # Tdarr
          protocol: TCP
        - port: "61208" # Glances
          protocol: TCP
        - port: "3000" # Grafana
          protocol: TCP

---

apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: gaming-stack-ingress
  namespace: gaming
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - minecraft
  ingress:
  - fromEntities:
    - world
    - ingress
    toPorts:
      - ports:
        - port: "25565"
          protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app: homarr
    toPorts:
      - ports:
        - port: "25565" 
          protocol: ANY
        - port: "25575" # RCON port
          protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        app: tailscale
  egress:
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          k8s-app: kube-dns
      toPorts:
      - ports:
        - port: "53"
          protocol: ANY   
    # Allow outbound to Mojang for player authentication
    - toEntities:
      - world
      toPorts:
      - ports:
        - port: "443"
          protocol: TCP
        - port: "80" 
          protocol: TCP
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: monitoring
          app: homarr
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          app: tailscale

---

apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
