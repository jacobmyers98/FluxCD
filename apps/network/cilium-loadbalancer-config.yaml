apiVersion: "cilium.io/v2alpha1"
kind: CiliumBGPPeeringPolicy
metadata:
name: "unifi-peering"
spec:
nodeSelector:
matchLabels:
  kubernetes.io/os: "linux"
virtualRouters:
- localASN: 64512
exportPodCIDR: false
neighbors:
- peerAddress: "192.168.1.1/32"
  peerASN: 65000
serviceAdvertisements:
- matchLoadBalancerIPs: true

---

apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: waffle-lb-pool
spec:
  blocks:
  - start: "192.168.1.254"
    stop: "192.168.1.254"

---

apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: waffle-l2-policy
spec:
  # This tells Cilium to announce these IPs on all Linux nodes in your cluster
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/os
        operator: In
        values:
          - linux
  externalIPs: true
  loadBalancerIPs: true
