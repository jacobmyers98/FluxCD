# L2 announcements: Cilium answers ARP requests ("who has 192.168.1.254?") on the LAN for
# LoadBalancer / external IPs, so devices on the home network reach the Ingress at
# 192.168.1.254 as if it were a normal machine. One node at a time holds each IP (a
# lease); with one node, that's always gameserver. The IPs come from the pool in
# cilium-bgp-setup.yaml. Needs Cilium's l2announcements.enabled=true (README, step 1).
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: waffle-l2-policy
spec:
  # This tells Cilium to announce these IPs on all Linux nodes in your cluster
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/os
        operator: In
        values:
          - linux
  externalIPs: true       # announce Services' spec.externalIPs
  loadBalancerIPs: true   # announce LoadBalancer IPs (192.168.1.254)
