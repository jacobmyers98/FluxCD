# All HTTPS entry points (Ingresses), one per namespace. Plain YAML, not encrypted: edit freely.
# (Until 2026-11-17 they lived in cert-manager.yaml next to the SOPS-encrypted issuer + token.)
#
# How a request reaches an app:
#   browser → https://<app>.waffle-systems.com → LAN DNS (UDM) → 192.168.1.254 (Cilium's ingress
#   LoadBalancer IP, cilium-bgp-setup.yaml / cilium-l2-setup.yaml) → Cilium's Envoy terminates TLS
#   → the backend Service named in the matching rule below.
# Certificates: the `cert-manager.io/cluster-issuer` annotation makes cert-manager request one
# Let's Encrypt certificate per Ingress, covering every host in `tls.hosts` (DNS-01 via Cloudflare,
# see cluster-issuer.yaml), stored in the Secret `tls.secretName` and renewed automatically.
#   kubectl get certificates -A        (READY should be True)
#
# Adding a site:
#   1. add the host to `tls.hosts` AND a rule under `rules` of the Ingress in the app's namespace
#      (an Ingress can only send traffic to Services in its own namespace);
#   2. add a LAN DNS record <host> → 192.168.1.254 on the UDM (there's no wildcard record);
#   3. the app's pods must allow traffic from the ingress in the namespace's Cilium policy
#      (cilium-network-mTLS.yaml). The domain has no public DNS: these sites only work on the
#      LAN or over Tailscale (with split DNS).
# Not here: backtest.waffle-systems.com (apps/dev/backtest/overlays/home/ingress.yaml).

# ---- kube-system: Hubble UI (Cilium network flows) and Vaultwarden (passwords) ----
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kube-system-tls
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"   # cert-manager issues the certificate below
spec:
  ingressClassName: cilium      # handled by Cilium's built-in ingress (Envoy)
  tls:
  - hosts:
    - hubble.waffle-systems.com
    - vault.waffle-systems.com
    secretName: kube-system-tls # cert-manager stores the certificate + key here
  rules:
  # --- Hubble ---
  - host: hubble.waffle-systems.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hubble-ui
            port:
              number: 80
  # --- Vaultwarden ---
  - host: vault.waffle-systems.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: port-service-vaultwarden
            port:
              number: 80

---

