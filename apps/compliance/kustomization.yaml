# compliance namespace: security scanning and the Headlamp UI.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml                # this folder's Namespace (never pruned)
  - helmrelease.yaml   # trivy-operator + trivy-server (kubescape commented out)
  - helmrepo.yaml      # Aqua's chart repo
  - trivy-pv.yaml      # storage for trivy-server's vulnerability DB
  - headlamp.yaml      # Headlamp dashboard + its read-only login
  - neuvector.yaml     # NeuVector runtime security (trial, compare with Trivy + Headlamp)
  # Kubescape disabled 2026-11-14 (see helmrelease.yaml); its PV + ServiceMonitor are in archive/compliance/
