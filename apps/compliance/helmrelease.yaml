apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    image.toolkit.fluxcd.io/image-ref: trivy
  name: aqua
  namespace: compliance
spec:
  interval: 1h
  releaseName: trivy-operator
  chart:
    spec:
      chart: trivy-operator
      version: ">=0.32.1"
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
  values:
    operator:
      scanJobsConcurrentLimit: 2
    trivy:
      serverURL: "http://trivy-server.compliance.svc:4954"
      resources:
        requests:
          cpu: 100m
          memory: 200M
        limits:
          cpu: 500m
          memory: 500M
      mode: ClientServer
      ignoreUnfixed: true
      image:
        repository: aquasec/trivy
        tag: latest
    serviceMonitor:
      enabled: true
      namespace: compliance
      labels:
        release: prometheus-community

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-server
  namespace: compliance
spec:
  interval: 1h
  chart:
    spec:
      chart: trivy
      version: "0.25.0"
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
  values:
    fullnameOverride: trivy-server
    server:
      enabled: true
    podSecurityContext:
      runAsUser: 1001
      runAsGroup: 1004
      fsGroup: 1004
      runAsNonRoot: true


---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape
  namespace: compliance
spec:
  interval: 1h
  chart:
    spec:
      chart: kubescape-operator
      version: "1.8.1"
      sourceRef:
        kind: HelmRepository
        name: kubescape
        namespace: kubescape
  values:
    clusterName: "default" 
    capabilities:
      configurationScan: enable
      continuousScan: enable
      vulnerabilityScan: disable