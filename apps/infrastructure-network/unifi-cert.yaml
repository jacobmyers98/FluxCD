apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: udm-pro-internal-cert
  namespace: infrastructure-network
spec:
  secretName: udm-pro-tls-internal
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  subject:
    organizations:
      - MyHomeLab
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  usages:
    - server auth
  dnsNames:
    - "unifi.waffle-network.local"
  issuerRef:
    name: my-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io