# Nightly backup of the Immich photo library to the backup HDD (/mnt/backup).
# Added 2026-11-26.
#
# Only Immich, because it's the one thing the weekly server backup can't see: the photos live on
# /mnt/Media/immich, while weekly-server-backup (apps/kube-system/server-backup-cron.yaml) copies
# /home/server. Mealie, Homarr, SnapOtter and Immich's Postgres folder all live under
# /home/server/docker, so they're covered there (weekly, newest 3 copies). Vaultwarden too (the owner
# doesn't need it backed up: the phone app keeps a local copy). The owner dropped the nightly
# app-data archives on 2026-11-26 for that reason.
#
# What this job copies: rsync mirror of /mnt/Media/immich → /mnt/backup/immich-library/current
#   upload/ library/ profile/  = original photos/videos and avatars
#   backups/                   = Immich's own nightly database dump (02:00, keeps 14). This is the
#                                DB copy to restore from: the weekly copy of the Postgres folder is
#                                taken while Postgres runs and may not start cleanly.
# Not copied: thumbs/ and encoded-video/ (Immich rebuilds them: Administration → Jobs).
# Files deleted or changed since the last run are moved to deleted/<date>/ instead of being lost,
# and kept 30 days, so an accidental delete in Immich can still be recovered from here.
#
# Restore: copy current/ back to /mnt/Media/immich, then restore the newest dump from backups/ per
# https://immich.app/docs/administration/backup-and-restore (or "Restore" on Immich's welcome page).
# Google Drive (offsite copy of the photos only) is planned but not set up yet (owner, 2026-11-26).
# Failures show up as a failed Job (KubeJobFailed alert → Discord).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: infrastructure-backup
  namespace: infrastructure
spec:
  schedule: "30 4 * * *"       # daily 04:30 (after Immich's 02:00 DB dump, the Sunday 02:00 server
  timeZone: America/Denver     # backup and the Sunday 03:00 etcd backup)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600   # 6 h: the first copy of a large library can take a while
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
          - name: backup
            image: alpine:3.24.4 # {"$imagepolicy": "flux-system:alpine-policy"}
            resources:
              requests: {cpu: 100m, memory: 128Mi}
              limits: {cpu: "2", memory: 1Gi}
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                # Refuse to run if the backup HDD isn't mounted (then /mnt/backup would be an empty
                # folder on the root SSD and the copy would fill it). /rootfs-check is a folder on the root SSD.
                if [ "$(stat -c %d /mnt/backup)" = "$(stat -c %d /rootfs-check)" ]; then
                  echo "ERROR: /mnt/backup is on the root filesystem; is the backup HDD mounted?" >&2
                  exit 1
                fi
                # And refuse if the library looks empty (e.g. /mnt/Media not mounted): with --delete
                # that would move the whole mirror into deleted/.
                if [ ! -d /src/immich/upload ] && [ ! -d /src/immich/library ]; then
                  echo "ERROR: /mnt/Media/immich has no upload/ or library/ folder; is /mnt/Media mounted?" >&2
                  exit 1
                fi
                apk add --no-cache rsync >/dev/null

                STAMP="$(date +%F_%H%M)"
                LIB=/mnt/backup/immich-library
                mkdir -p "$LIB/current" "$LIB/deleted"
                rsync -a --delete --backup --backup-dir="$LIB/deleted/$STAMP" \
                  --include='/upload/***' --include='/library/***' --include='/profile/***' --include='/backups/***' \
                  --exclude='*' \
                  /src/immich/ "$LIB/current/"
                find "$LIB/deleted" -mindepth 1 -maxdepth 1 -type d -mtime +30 -exec rm -rf {} +
                echo "immich library done: $(du -sh "$LIB/current" | cut -f1) in $LIB/current"
                df -h /mnt/backup | tail -1
            volumeMounts:
            - {name: immich, mountPath: /src/immich, readOnly: true}
            - {name: backup, mountPath: /mnt/backup}
            - {name: rootfs-check, mountPath: /rootfs-check, readOnly: true}
          volumes:
          - {name: immich, hostPath: {path: /mnt/Media/immich, type: Directory}}
          - {name: backup, hostPath: {path: /mnt/backup, type: Directory}}
          - {name: rootfs-check, hostPath: {path: /home/server/docker/immich, type: Directory}}
