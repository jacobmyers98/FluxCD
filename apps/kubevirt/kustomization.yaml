# KubeVirt: runs real virtual machines (like dev/devbox) next to containers.
# Applied by its own Flux Kustomization "kubevirt" (last entry in clusters/my-cluster/apps.yaml), NOT by
# any other entry: the operator's CRDs must have exactly one owner, or moving/removing them between two
# Kustomizations can prune the CRDs and with them every VM.
#
# The two files come straight from the KubeVirt GitHub release (kustomize downloads them):
#   1. kubevirt-operator.yaml: namespace kubevirt, the CRDs and the virt-operator Deployment
#   2. kubevirt-cr.yaml: the "KubeVirt" object that tells virt-operator to install the rest
#      (virt-api, virt-controller, virt-handler on each node, ...)
# The KubeVirt object has no imageTag, so the installed version = the operator's version.
#
# UPGRADING: KubeVirt only supports going one minor version at a time, from the latest patch
# of each minor (v1.8.4 → v1.9.1 → v1.10.x ...). Change BOTH URLs to the next step, push,
# then wait until `kubectl -n kubevirt get kubevirt` shows the new version, Available and
# not Progressing, before the next step. Running VMs keep their old virt-launcher until
# they are restarted (`virtctl -n dev restart devbox`; devbox's disk resets on restart).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # 1. The Operator
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.1/kubevirt-operator.yaml
  # 2. The KubeVirt Custom Resource
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.1/kubevirt-cr.yaml

# Safety net: if this folder (or its entry in apps.yaml) is ever removed by mistake, Flux must NOT
# delete the KubeVirt CR: virt-operator would then uninstall KubeVirt and stop every VM. Its CRD
# (kubevirts.kubevirt.io, the only CRD in these files) is protected too, since deleting a CRD deletes
# the CR with it, and so is the kubevirt Namespace (deleting it deletes the CR inside it).
# The VM CRDs are created by virt-operator itself, not by Flux.
# To really uninstall KubeVirt: delete the CR by hand (`kubectl -n kubevirt delete kubevirt kubevirt`).
patches:
  - target:
      kind: KubeVirt
    patch: |-
      apiVersion: kubevirt.io/v1
      kind: KubeVirt
      metadata:
        name: not-used   # replaced by the target's name
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: not-used
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      kind: Namespace
      name: kubevirt
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: kubevirt
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
