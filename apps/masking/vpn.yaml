apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: masking
  labels:
    app: tailscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale
  template:
    metadata:
      labels:
        app: tailscale
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: tailscale-sa
      containers:
      - name: tailscale
        image: tailscale/tailscale:v1.96.5
        env:
        - name: TS_KUBE_SECRET
          value: "tailscale"
        - name: TS_EXTRA_ARGS
          value: "--snat-subnet-routes=true"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: TS_ROUTES
          value: "192.168.1.0/24" 
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: TS_AUTHKEY
        securityContext:
          capabilities:
            add:
            # Required for Tailscale to manage networking and routing
            - NET_ADMIN
            - NET_RAW
        volumeMounts:
        - name: tun-device
          mountPath: /dev/net/tun
      volumes:
      - name: tun-device
        hostPath:
          path: /dev/net/tun

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-sa
  namespace: masking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-role
  namespace: masking
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # Permission to manage its own state secret
    verbs: ["get", "update", "patch", "create"]
  - apiGroups: [""]
    resources: ["events"]
    # Permission to write logs/events to the pod as requested in your logs
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-rolebinding
  namespace: masking
subjects:
  - kind: ServiceAccount
    name: tailscale-sa
    namespace: masking
roleRef:
  kind: Role
  name: tailscale-role
  apiGroup: rbac.authorization.k8s.io