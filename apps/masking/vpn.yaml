apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-subnet-router
  namespace: default
  labels:
    app: tailscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale
  template:
    metadata:
      labels:
        app: tailscale
    spec:
      # hostNetwork bypasses K8s internal CNI. This makes it much easier 
      # for the container to route traffic directly to your physical LAN.
      hostNetwork: true 
      containers:
      - name: tailscale
        image: tailscale/tailscale:1
        env:
        # 2. Define your home network subnet here (e.g., 192.168.1.0/24 or 10.0.0.0/24)
        - name: TS_ROUTES
          value: "192.168.1.0/24" 
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: TS_AUTHKEY
        securityContext:
          capabilities:
            add:
            # Required for Tailscale to manage networking and routing
            - NET_ADMIN
            - NET_RAW
        volumeMounts:
        - name: tun-device
          mountPath: /dev/net/tun
      volumes:
      # Mount the host's TUN device so WireGuard can create network interfaces
      - name: tun-device
        hostPath:
          path: /dev/net/tun
