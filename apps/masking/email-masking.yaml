---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: addy-io
  namespace: masking
  labels:
    app: addy-io
spec:
  replicas: 1
  selector:
    matchLabels:
      app: addy-io
  template:
    metadata:
      labels:
        app: addy-io
    spec:
      containers:
      - name: addy-io-web
        # Addy.io still uses the anonaddy image repository
        image: anonaddy/anonaddy:1.3.8
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        # Core App Settings
        - name: APP_NAME
          value: "Addy.io"
        - name: APP_ENV
          value: "local" 
        - name: APP_DEBUG
          value: "true"
        - name: APP_URL
          value: "http://localhost:8000"
        - name: ANONADDY_DOMAIN
          value: "addy.waffle-k8s.local"
        - name: ANONADDY_ADMIN_USERNAME
          value: "admin"
        
        # Database Settings (Requires a separate MariaDB/MySQL Pod)
        - name: DB_CONNECTION
          value: "mysql"
        - name: DB_HOST
          value: "mariadb-service-name" # Change to your DB service name/IP
        - name: DB_PORT
          value: "3306"
        - name: DB_DATABASE
          value: "anonaddy"
        - name: DB_USERNAME
          value: "anonaddy_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-admin
              key: admin-password
        - name: ANONADDY_SECRET
          valueFrom:
            secretKeyRef:
              name: addy-io-secrets
              key: ANONADDY_SECRET
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: addy-io-secrets
              key: APP_KEY
        # Redis Settings (Requires a separate Redis Pod)
        - name: REDIS_HOST
          value: "redis-service-name" # Change to your Redis service name/IP
        - name: REDIS_PASSWORD
          value: "null"
        - name: REDIS_PORT
          value: "6379"

---
apiVersion: v1
kind: Service
metadata:
  name: port-service-addy
  namespace: masking
spec:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30020
  selector:
    app: addy-io
  type: NodePort