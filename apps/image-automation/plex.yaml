# Image automation for the plex namespace's apps (moved from apps/plex/ on 2026-11-17).
# These objects live in flux-system; the apps they update stay in namespace plex.
# Setter comments point here as "flux-system:<policy-name>". See kustomization.yaml for how it works.
# plex: ImageRepositories first (which registry image Flux watches, and how often),
# then the ImagePolicies (which tag to pick).
# linuxserver/* = LinuxServer.io images (Docker Hub; lscr.io is their own mirror of the same images).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: radarr
  namespace: flux-system
spec:
  image: linuxserver/radarr
  interval: 6h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: sonarr
  namespace: flux-system
spec:
  image: linuxserver/sonarr
  interval: 6h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: prowlarr
  namespace: flux-system
spec:
  image: linuxserver/prowlarr
  interval: 6h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: seerr
  namespace: flux-system
spec:
  image: ghcr.io/seerr-team/seerr
  interval: 6h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: qbittorrent
  namespace: flux-system
spec:
  image: lscr.io/linuxserver/qbittorrent
  interval: 6h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: tdarr
  namespace: flux-system
spec:
  image: ghcr.io/haveagitgat/tdarr
  interval: 6h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: tdarr-node
  namespace: flux-system
spec:
  image: ghcr.io/haveagitgat/tdarr_node
  interval: 6h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cloudflared
  namespace: flux-system
spec:
  image: cloudflare/cloudflared
  interval: 6h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: kubectl
  namespace: flux-system
spec:
  image: registry.k8s.io/kubectl
  interval: 24h

---
# These apps are used by other people ("production"), and most ranges have no upper
# limit, so major upgrades arrive automatically within a few hours of release.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: radarr-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: radarr
  policy:
    semver:
      range: ">=5.27.0"           # Radarr, majors included

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sonarr-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: sonarr
  policy:
    semver:
      range: ">=4.0.14"           # Sonarr, majors included

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: prowlarr-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: prowlarr
  policy:
    semver:
      range: ">=2.3.0"            # Prowlarr, majors included (2.x → 3.0.2 arrived this way)

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: seerr-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: seerr
  policy:
    semver:
      range: ">=v3.4.1"           # Seerr (tags start with "v")

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: qbittorrent-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: qbittorrent
  policy:
    semver:
      range: ">=5.2.3 <9.0.0"     # qBittorrent; the upper limit skips linuxserver's old date-style tags (e.g. 20.04.1)

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: tdarr-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: tdarr
  policy:
    semver:
      range: ">=2.86.01"          # Tdarr server; keep it on the same version as tdarr-node

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: tdarr-node-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: tdarr-node
  policy:
    semver:
      range: ">=2.86.01"          # Tdarr node (must match the server's version)

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cloudflared-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: cloudflared
  policy:
    semver:
      range: ">=2026.10.3"        # cloudflared uses date versions (YYYY.MM.patch)

---
# kubectl for the qbittorrent-restarter CronJob. Stays on the cluster's minor version;
# raise the range when the cluster is upgraded.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: kubectl-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: kubectl
  policy:
    semver:
      range: ">=1.37.0 <1.38.0"
