# Image automation for the gaming namespace's apps (moved from apps/gaming/ on 2026-11-17).
# These objects live in flux-system; the apps they update stay in namespace gaming.
# Setter comments point here as "flux-system:<policy-name>". See kustomization.yaml for how it works.
# gaming: Cloudflare DDNS (keeps minecraft.waffle-systems.com pointing at the home IP).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cloudflare-ddns
  namespace: flux-system
spec:
  image: favonia/cloudflare-ddns   # Docker Hub
  interval: 6h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cloudflare-ddns-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: cloudflare-ddns
  policy:
    semver:
      range: ">=1.18.0"   # any newer release, majors included
