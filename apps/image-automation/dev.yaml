# Image automation for the dev namespace's apps (moved from apps/dev/ on 2026-11-17).
# These objects live in flux-system; the apps they update stay in namespace dev.
# Setter comments point here as "flux-system:<policy-name>". See kustomization.yaml for how it works.
# dev: n8n + its task runner (follow the "stable" tag by digest), the n8n sandbox
# (semver 1.x) and Ollama (semver 0.x).
#
# n8n publishes betas as plain semver tags (e.g. 2.46.0 = "next"), so a semver range would pull betas.
# Instead follow n8n's "stable" tag by digest; n8n and runners move their "stable" tags together,
# which keeps the two containers on the same version.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: n8n-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: n8n
  filterTags:
    pattern: '^stable$'        # only consider the tag named exactly "stable"
  policy:
    alphabetical:            # with a single candidate tag, the sort order doesn't matter
      order: asc
  digestReflectionPolicy: Always   # also look up the tag's digest (sha256) every interval: "stable" keeps its name but moves to new builds
  interval: 1h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: n8n-runners-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: n8n-runners
  filterTags:
    pattern: '^stable$' # there is no stable-distroless tag
  policy:
    alphabetical:
      order: asc
  digestReflectionPolicy: Always
  interval: 1h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: n8n-sandbox-api-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: n8n-sandbox-api
  policy:
    semver:
      range: ">=1.11.0 <2.0.0"   # sandbox 1.x only; keep api and runner on the same version

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: n8n-sandbox-runner-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: n8n-sandbox-runner
  policy:
    semver:
      range: ">=1.11.0 <2.0.0"

---

apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: n8n
  namespace: flux-system
spec:
  image: n8nio/n8n
  interval: 1h
  exclusionList: ["nightly", "-pc", "-amd64$", "-arm64$"] # thousands of nightly/arch tags; only "stable" is used

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: n8n-runners
  namespace: flux-system
spec:
  image: n8nio/runners
  interval: 1h
  exclusionList: ["nightly", "-amd64$", "-arm64$"]

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: n8n-sandbox-api
  namespace: flux-system
spec:
  image: n8nio/n8n-sandbox-service-api
  interval: 6h   # check for new tags every 6 hours

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: n8n-sandbox-runner
  namespace: flux-system
spec:
  image: n8nio/n8n-sandbox-service-runner-dind
  interval: 6h
---
# Ollama (container in the n8n pod). Plain semver skips the -rc and -rocm tags (pre-releases).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: ollama-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: ollama
  policy:
    semver:
      range: ">=0.40.16 <1.0.0"

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: ollama
  namespace: flux-system
spec:
  image: ollama/ollama
  interval: 6h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: node
  namespace: flux-system
spec:
  image: node
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: node-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: node
  filterTags:
    pattern: '^(?P<v>22\.\d+\.\d+)-alpine$'
    extract: '$v'
  policy:
    semver:
      range: ">=22.21.1 <23.0.0"   # Node 22 LTS, alpine image (discord-assistant)
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: mongo
  namespace: flux-system
spec:
  image: mongo
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: mongo-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: mongo
  filterTags:
    pattern: '^\d+\.\d+\.\d+$'
  policy:
    semver:
      range: ">=8.0.34 <8.1.0"   # patch releases only: a MongoDB minor/major upgrade needs a featureCompatibilityVersion step
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: searxng
  namespace: flux-system
spec:
  image: searxng/searxng
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: searxng-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: searxng
  filterTags:
    pattern: '^(?P<v>\d+\.\d+\.\d+)-[0-9a-f]+$'
    extract: '$v'
  policy:
    semver:
      range: ">=2026.10.19"   # date tags YYYY.M.D-<commit>; the date is compared as a version
