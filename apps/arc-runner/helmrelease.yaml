apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: arc
  namespace: dev
spec:
  interval: 1h
  install:
    createNamespace: true
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: "0.15.0"
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: flux-system

---

apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: my-runner-set
  namespace: dev
spec:
  interval: 1h
  install:
    createNamespace: true
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.15.0"
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: flux-system
  values:
    githubConfigUrl: "https://github.com/jacobmyers98/Finance-Friend"
    githubConfigSecret: github-arc-auth
    containerMode:
          type: "dind"