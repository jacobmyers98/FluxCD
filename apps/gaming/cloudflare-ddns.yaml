apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: gaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      containers:
      - name: cloudflare-ddns
        image: oznu/cloudflare-ddns:latest
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: cloudflare-ddns
              key: token
        - name: ZONE
          value: "waffle-systems.com"
        - name: SUBDOMAIN
          value: "minecraft"
        - name: PROXIED
          value: "false"