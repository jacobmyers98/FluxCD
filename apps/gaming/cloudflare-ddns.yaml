apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: gaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: cloudflare-ddns
        image: favonia/cloudflare-ddns:1.18.0 # {"$imagepolicy": "gaming:cloudflare-ddns-policy"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        env:
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-ddns
              key: token
        - name: DOMAINS
          value: "minecraft.waffle-systems.com"
        - name: PROXIED
          value: "false"
        - name: IP6_PROVIDER
          value: "none"
