apiVersion: v1
kind: Service
metadata:
  name: project-zomboid-service
  namespace: gaming
spec:
  type: NodePort
  selector:
    app: project-zomboid
  ports:
    - name: game
      protocol: UDP
      port: 16261
      targetPort: 16261
      nodePort: 30021
    - name: direct
      protocol: UDP
      port: 16262
      targetPort: 16262
      nodePort: 30022

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-zomboid
  namespace: gaming
  labels:
    app: project-zomboid
spec:
  replicas: 1
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: project-zomboid
  template:
    metadata:
      labels:
        app: project-zomboid
    spec:
      securityContext:
        fsGroup: 10000 
      containers:
        - name: pz-server
          image: indifferentbroccoli/projectzomboid-server-docker:latest
          env:
            - name: PUID
              value: "10000"
            - name: PGID
              value: "10000"
            - name: SERVER_NAME
              value: "ProJM" 
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project-zomboid
                  key: ADMIN_PASSWORD
            - name: MEMORY_XMX_GB
              value: "16"
          ports:
            - containerPort: 16261
              protocol: UDP
              name: game
            - containerPort: 16262
              protocol: UDP
              name: direct
          volumeMounts:
            - name: pz-server-files
              mountPath: /project-zomboid
            - name: pz-data-files
              mountPath: /project-zomboid-config
      volumes:
        - name: pz-server-files
          hostPath:
            path: /home/server/docker/proj-zom/server
            type: DirectoryOrCreate
        - name: pz-data-files
          hostPath:
            path: /home/server/docker/proj-zom/data
            type: DirectoryOrCreate