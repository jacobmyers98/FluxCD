# gaming namespace (used by outside players: treat as production).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - minecraft.yaml                # NeoForge Minecraft server
  - cloudflare-ddns.yaml          # keeps the Minecraft DNS record on the current home IP
# Project Zomboid is disabled; its files are in archive/gaming/ (move both back and list them here to run it)
  - secret.cloudflare-ddns.yaml   # Cloudflare API token (SOPS)
