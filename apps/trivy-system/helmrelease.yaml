apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    image.toolkit.fluxcd.io/image-ref: trivy
  name: aqua
  namespace: trivy-system
spec:
  interval: 15m
  releaseName: trivy-operator
  chart:
    spec:
      chart: trivy-operator
      version: ">=0.32.1"
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
  values:
    operator:
      scanJobsConcurrentLimit: 2
    trivy:
      resources:
        requests:
          cpu: 100m
          memory: 200M
        limits:
          cpu: 500m
          memory: 500M
      mode: ClientServer
      ignoreUnfixed: true
      image:
        repository: aquasec/trivy
        tag: latest
    serviceMonitor:
      enabled: true
      namespace: trivy-system
      labels:
        release: prometheus-community

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-server
  namespace: trivy-system
spec:
  interval: 1h
  chart:
    spec:
      chart: trivy
      version: "0.25.0" # You can pin this to a specific chart version if preferred
      sourceRef:
        kind: HelmRepository
        name: aqua
  values:
    # Explicitly name the release to ensure the service name is predictable
    fullnameOverride: trivy-server
    server:
      enabled: true
