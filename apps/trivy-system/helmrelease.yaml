apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    image.toolkit.fluxcd.io/image-ref: trivy
  name: aqua
  namespace: trivy-system
spec:
  interval: 15m
  releaseName: trivy-operator
  chart:
    spec:
      chart: trivy-operator
      version: 0.31.0
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
  values:
    trivy:
      ignoreUnfixed: true
      image:
        repository: aquasec/trivy
        tag: latest
    serviceMonitor:
      enabled: true
      namespace: trivy-system
      labels:
        release: prometheus-community