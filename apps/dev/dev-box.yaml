apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: devbox
  namespace: dev
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: devbox
    spec:
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
        devices:
          autoattachSerialConsole: false
          interfaces:
          - name: default
            masquerade: {}
          disks:
          - name: containerdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
        features:
          smm:
            enabled: true     # required by KubeVirt for EFI SecureBoot
        firmware:
          bootloader:
            efi:
              secureBoot: true
      networks:
      - name: default
        pod: {}
      volumes:
      - name: containerdisk
        containerDisk:
          image: quay.io/containerdisks/fedora:45
      - name: cloudinitdisk
        cloudInitNoCloud:
          secretRef:
            name: devbox-cloud-init
