apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n-sandbox
  template:
    metadata:
      labels:
        app: n8n-sandbox
    spec:
      containers:
      - name: sandbox
        image: docker.n8n.io/n8nio/n8n-sandbox:latest
        securityContext:
          privileged: true
        env:
        - name: N8N_SANDBOX_SERVICE_API_KEY
          value: "my-sandbox-secret-key"
        ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: n8n-sandbox
spec:
  selector:
    app: n8n-sandbox
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080