apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-friend
  namespace: dev
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        exposed: nodeport
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: web
        image: ghcr.io/jacobmyers98/finance-friend-container:1.0.64 #  {"$imagepolicy": "dev:web-policy"}
        ports:
        - containerPort: 8081
        env:
        - name: TWELVE_DATA_API_KEY
          valueFrom:
            secretKeyRef:
              name: finance-friend-secret
              key: TWELVE_DATA_API_KEY
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8081
            protocol: HTTP2
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: port-service-finance-friend
  namespace: dev
  labels:
    app: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30024
