apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-friend
  namespace: dev
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        exposed: nodeport
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: web
        image: ghcr.io/jacobmyers98/finance-friend-container:1.0.19 #  {"$imagepolicy": "dev:web-policy"}
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: port-service-finance-friend
  namespace: dev
  labels:
    app: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30024
