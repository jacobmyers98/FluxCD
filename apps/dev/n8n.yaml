apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: dev
  labels:
    app: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite: never two n8n pods on one database
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:2.44.6
        ports:
        - containerPort: 5678
        - containerPort: 5679 # Opens port for the Task Broker
        env:
        - name: N8N_RUNNERS_MODE
          value: "external"
        - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
          value: "0.0.0.0"
        - name: N8N_RUNNERS_AUTH_TOKEN
          value: "my-secure-random-token" # Must match the runner token
        - name: N8N_INSTANCE_AI_SANDBOX_ENABLED
          value: "true"
        - name: N8N_INSTANCE_AI_SANDBOX_PROVIDER
          value: "n8n-sandbox"
        - name: N8N_SANDBOX_SERVICE_URL
          value: "http://sandbox-api:8080"
        - name: WEBHOOK_URL
          value: "http://192.168.1.200:30018/" # Base URL for webhook and review-form links (LAN + Tailscale subnet route)
        - name: N8N_INSTANCE_AI_SEARXNG_URL
          value: "http://searxng:8080" # Web search for the Instance AI agent
        - name: N8N_SANDBOX_SERVICE_API_KEY
          value: "my-sandbox-secret-key"
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
        - name: n8n-files
          mountPath: /home/node/.n8n-files # n8n's default allowed folder for file nodes (generated shop images live in images/)
          
      # 2. Python/JavaScript Sandbox (Task Runner)
      - name: n8n-task-runner
        image: n8nio/runners:2.44.6-distroless # must match the n8n version
        env:
        - name: N8N_RUNNERS_AUTH_TOKEN
          value: "my-secure-random-token" # Matches the n8n token
        - name: N8N_RUNNERS_TASK_BROKER_URI
          value: "http://127.0.0.1:5679"

      # --- Container 2: Ollama ---
      - name: ollama
        image: ollama/ollama:latest
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0"
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: 1
      volumes:
      - name: ollama-data
        hostPath:
          path: /home/server/docker/ollama
          type: DirectoryOrCreate
      - name: n8n-data
        hostPath:
          path: /home/server/docker/n8n
          type: DirectoryOrCreate
      - name: n8n-files
        hostPath:
          path: /home/server/docker/n8n-files
          type: DirectoryOrCreate

---

apiVersion: v1
kind: Service
metadata:
  name: port-service-n8n
  namespace: dev
spec:
  type: NodePort
  selector:
    app: n8n
  ports:
    - protocol: TCP
      port: 5678
      targetPort: 5678
      nodePort: 30018

---

apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: dev
spec:
  type: ClusterIP
  selector:
    app: n8n
  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434