apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: dev
  labels:
    app: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite: never two n8n pods on one database
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      initContainers:
      # Hands the host volumes to container_user (1001:1004); group-writable so user server (in group 1004) keeps write access
      - name: fix-perms
        image: busybox:1.37
        securityContext:
          runAsUser: 0
        command: ["sh", "-c", "chown -R 1001:1004 /n8n /files /ollama && chmod -R g+rwX /n8n /files"]
        volumeMounts:
        - name: n8n-data
          mountPath: /n8n
        - name: n8n-files
          mountPath: /files
        - name: ollama-data
          mountPath: /ollama
      containers:
      - name: n8n
        image: n8nio/n8n:stable@sha256:56a3f0d56c2888b53ca7d89de4aa3de702888f33667c96a1f1d7118548f979e9 # {"$imagepolicy": "dev:n8n-policy"}
        securityContext:
          runAsUser: 1001 # container_user
          runAsGroup: 1004
        ports:
        - containerPort: 5678
        - containerPort: 5679 # Opens port for the Task Broker
        env:
        - name: HOME
          value: /home/node # uid 1001 has no passwd entry; n8n keeps its data in $HOME/.n8n
        - name: N8N_RUNNERS_MODE
          value: "external"
        - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
          value: "0.0.0.0"
        - name: N8N_RUNNERS_TASK_TIMEOUT
          value: "600" # seconds per Code node run (default 60); Job Scout's Collect/Score Jobs need several minutes
        - name: N8N_SCHEDULER_ENABLED
          value: "false" # 2.46+ durable scheduler fired Schedule Triggers without starting executions; use the legacy in-memory engine
        - name: N8N_RUNNERS_AUTH_TOKEN
          value: "my-secure-random-token" # Must match the runner token
        - name: N8N_INSTANCE_AI_SANDBOX_ENABLED
          value: "true"
        - name: N8N_INSTANCE_AI_SANDBOX_PROVIDER
          value: "n8n-sandbox"
        - name: N8N_SANDBOX_SERVICE_URL
          value: "http://sandbox-api:8080"
        - name: WEBHOOK_URL
          value: "https://n8n.waffle-systems.com/" # Base URL for webhook, form and review links (cilium ingress + dev-tls cert; the name resolves on the home network)
        - name: N8N_INSTANCE_AI_SEARXNG_URL
          value: "http://searxng:8080" # Web search for the Instance AI agent
        - name: N8N_SANDBOX_SERVICE_API_KEY
          value: "my-sandbox-secret-key"
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
        - name: n8n-files
          mountPath: /home/node/.n8n-files # n8n's default allowed folder for file nodes (generated shop images live in images/)
        - name: n8n-cache
          mountPath: /home/node/.cache # image's /home/node is owned by uid 1000; n8n writes static assets here at startup
      # 2. Python/JavaScript Sandbox (Task Runner)
      # Version must match n8n: both images follow the "stable" tag (image-policies.yaml)
      - name: n8n-task-runner
        image: n8nio/runners:stable@sha256:e2aed3c5f1e8e93033584aa835094c919bb9b530f007f5de07f4c94ce90e82b1 # {"$imagepolicy": "dev:n8n-runners-policy"}
        env:
        - name: N8N_RUNNERS_AUTH_TOKEN
          value: "my-secure-random-token" # Matches the n8n token
        - name: N8N_RUNNERS_TASK_BROKER_URI
          value: "http://127.0.0.1:5679"
        - name: N8N_RUNNERS_TASK_TIMEOUT
          value: "600" # must match the n8n container
      # --- Container 2: Ollama ---
      - name: ollama
        image: ollama/ollama:latest
        securityContext:
          runAsUser: 1001 # container_user
          runAsGroup: 1004
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0"
        - name: HOME
          value: /home/ollama # non-root: models and key live in $HOME/.ollama
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: ollama-data
          mountPath: /home/ollama/.ollama
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: 1
      volumes:
      - name: ollama-data
        hostPath:
          path: /home/server/docker/ollama
          type: DirectoryOrCreate
      - name: n8n-data
        hostPath:
          path: /home/server/docker/n8n
          type: DirectoryOrCreate
      - name: n8n-files
        hostPath:
          path: /home/server/docker/n8n-files
          type: DirectoryOrCreate
      - name: n8n-cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: port-service-n8n
  namespace: dev
spec:
  type: NodePort
  selector:
    app: n8n
  ports:
    - protocol: TCP
      port: 5678
      targetPort: 5678
      nodePort: 30018
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: dev
spec:
  type: ClusterIP
  selector:
    app: n8n
  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434
