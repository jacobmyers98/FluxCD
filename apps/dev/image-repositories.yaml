apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: n8n
  namespace: dev
spec:
  image: n8nio/n8n
  interval: 1h
  exclusionList: ["nightly", "-pc", "-amd64$", "-arm64$"] # thousands of nightly/arch tags; only "stable" is used

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: n8n-runners
  namespace: dev
spec:
  image: n8nio/runners
  interval: 1h
  exclusionList: ["nightly", "-amd64$", "-arm64$"]

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: n8n-sandbox-api
  namespace: dev
spec:
  image: n8nio/n8n-sandbox-service-api
  interval: 6h

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: n8n-sandbox-runner
  namespace: dev
spec:
  image: n8nio/n8n-sandbox-service-runner-dind
  interval: 6h
