# Template: kubectl create -f k8s/jobs/sweep-run.yaml
apiVersion: batch/v1
kind: Job
metadata:
  generateName: sweep-run-
  namespace: dev
  labels: {app.kubernetes.io/name: backtester, app.kubernetes.io/component: sweep}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app.kubernetes.io/name: backtester, app.kubernetes.io/component: sweep}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-pull}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sweep
          image: ghcr.io/jacobmyers98/backtester:0.1.0
          args: [sweep]
          env:
            - {name: BACKTEST_CONFIG, value: /etc/backtest/default.yaml}
            - name: RUN_ID
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['batch.kubernetes.io/job-name']"}}
          resources:
            requests: {cpu: "2", memory: 4Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/backtest, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: backtest-data}
        - name: config
          configMap: {name: backtest-config}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
