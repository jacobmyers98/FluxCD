# Template: kubectl create -f k8s/jobs/backtest-run.yaml (generateName gives each run a unique name = run id)
# Override params by appending args, e.g. args: [backtest, --set, ema_length=12]
apiVersion: batch/v1
kind: Job
metadata:
  generateName: backtest-run-
  namespace: dev
  labels: {app.kubernetes.io/name: backtester, app.kubernetes.io/component: backtest}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app.kubernetes.io/name: backtester, app.kubernetes.io/component: backtest}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-pull}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backtest
          image: ghcr.io/jacobmyers98/backtester:0.1.0
          args: [backtest]
          env:
            - {name: BACKTEST_CONFIG, value: /etc/backtest/default.yaml}
            - name: RUN_ID
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['batch.kubernetes.io/job-name']"}}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/backtest, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: backtest-data}
        - name: config
          configMap: {name: backtest-config}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
