apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: report-web
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: cilium
  tls:
    - hosts: [backtest.waffle-systems.com]
      secretName: backtest-tls
  rules:
    - host: backtest.waffle-systems.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: report-web, port: {number: 8080}}
