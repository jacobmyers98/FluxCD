# Ingress = HTTP(S) routing by host name and path. https://backtest.waffle-systems.com
# only resolves on the LAN / Tailscale (local DNS → 192.168.1.254), so the site isn't
# reachable from the internet. Longest matching path wins: /reports → report-web,
# everything else → the API's web UI on :8080.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: report-web
  namespace: dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod   # cert-manager sees this and gets a Let's Encrypt cert into backtest-tls
spec:
  ingressClassName: cilium      # served by Cilium's ingress controller (192.168.1.254)
  tls:
    - hosts: [backtest.waffle-systems.com]
      secretName: backtest-tls
  rules:
    - host: backtest.waffle-systems.com
      http:
        paths:
          - path: /reports        # static HTML reports
            pathType: Prefix
            backend:
              service: {name: report-web, port: {number: 8080}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: backtest-api, port: {number: 8080}}   # web UI
