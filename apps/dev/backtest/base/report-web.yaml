apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-web
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: backtester, app.kubernetes.io/component: report-web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: backtester, app.kubernetes.io/component: report-web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 10001          # read access to the report files
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.4-alpine
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 30}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /srv/data, readOnly: true}
            - {name: conf, mountPath: /etc/nginx/conf.d, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: backtest-data, readOnly: true}
        - name: conf
          configMap: {name: report-web-nginx}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: report-web
spec:
  selector: {app.kubernetes.io/name: backtester, app.kubernetes.io/component: report-web}
  ports: [{name: http, port: 8080, targetPort: 8080}]
