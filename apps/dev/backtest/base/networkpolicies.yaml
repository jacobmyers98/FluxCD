# Standard Kubernetes NetworkPolicies (Cilium enforces these too, next to the
# CiliumNetworkPolicies in apps/network). Rules from all policies that select a pod add up.
# podSelector picks the pods a policy applies to; policyTypes says which directions it
# locks down: once a direction is listed, only traffic matched by some rule is allowed.
# Shares namespace `dev` with other apps, so "default deny" is scoped to backtester pods only.
# Every backtester pod is denied unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backtester-default-deny
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: backtester}
  policyTypes: [Ingress, Egress]
---
# Downloader pods: DNS + HTTPS (Alpaca market data) only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backtester-downloader-egress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: backtester, app.kubernetes.io/component: downloader}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}   # any address, but only on port 443
      ports:
        - {protocol: TCP, port: 443}
---
# Backtest / sweep pods get no policy here, so default-deny leaves them with no egress.
# Report web: ingress on 8080 only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backtester-report-web-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: backtester, app.kubernetes.io/component: report-web}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
---
# API: only n8n may call the machine API (:8000); the web UI (:8080, no login) is reachable via the ingress; it may only call back to n8n's webhooks (plus DNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backtester-api
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: backtester, app.kubernetes.io/component: api}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: n8n}
      ports:
        - {protocol: TCP, port: 8000}
    - ports:                     # no "from" = from anywhere (the Ingress sends the web UI traffic)
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {app: n8n}
      ports:
        - {protocol: TCP, port: 5678}
