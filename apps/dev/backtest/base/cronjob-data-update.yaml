apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-update
spec:
  schedule: "30 18 * * 1-5"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels: {app.kubernetes.io/name: backtester, app.kubernetes.io/component: downloader}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: download
              image: ghcr.io/jacobmyers98/backtester:0.2.0
              args: [download]
              env:
                - {name: BACKTEST_CONFIG, value: /etc/backtest/default.yaml}
              envFrom:
                - secretRef: {name: alpaca-creds}
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits: {cpu: "1", memory: 1536Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: config, mountPath: /etc/backtest, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: backtest-data}
            - name: config
              configMap: {name: backtest-config}
            - name: tmp
              emptyDir: {sizeLimit: 1Gi}
