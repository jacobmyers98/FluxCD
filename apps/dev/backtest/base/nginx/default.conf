server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    location = / { return 302 /reports/; }
    location /reports/ {
        alias /srv/data/reports/;
        index index.html;
        autoindex off;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    location = /healthz { access_log off; return 200 "ok\n"; }
}
