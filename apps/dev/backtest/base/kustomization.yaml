apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
labels:
  - pairs: {app.kubernetes.io/part-of: backtester}
resources:
  - pvc.yaml
  - networkpolicies.yaml
  - cronjob-data-update.yaml
  - report-web.yaml
  - api.yaml
configMapGenerator:
  - name: backtest-config
    files: [default.yaml]   # keep in sync with config/default.yaml
  - name: report-web-nginx
    files: [nginx/default.conf]
generatorOptions:
  disableNameSuffixHash: true   # job templates reference these names
