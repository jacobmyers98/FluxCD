apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: plex-stack-ingress
  namespace: plex
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - plex
      - qbittorrent
      - prowlarr
      - radarr
      - sonarr
      - tdarr-node
      - tdarr-server
      - overseerr
      - requestrr

  ingress:
  # ----------------------------------------------------
  # RULE 1: Internal Media Stack Pods MUST use mTLS
  # ----------------------------------------------------
  - fromEndpoints:
    - matchExpressions:
      - key: "app"
        operator: In
        values:
        - plex
        - qbittorrent
        - prowlarr
        - radarr
        - sonarr
        - tdarr-node
        - tdarr-server
        - overseerr
        - requestrr
    authentication:
      mode: "required"
      
  # ----------------------------------------------------
  # RULE 2: External LAN traffic (NO mTLS)
  # NOTE: If all these pods have the 'exposed: nodeport' label,
  # your 'allow-external-nodeport' ClusterWide policy already 
  # allows world/host. We only include 'ingress' here in case 
  # you are routing anything locally via an Ingress Controller.
  # ----------------------------------------------------
  - fromEntities:
    - world
    - host
    - ingress