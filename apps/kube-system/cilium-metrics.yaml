# Prometheus scraping of the Cilium agent (cilium_* metrics: drops, policy verdicts, BPF
# maps, endpoint health). Cilium itself is installed with the cilium CLI/Helm, outside Flux;
# its agent serves metrics on :9962 (cilium-config prometheus-serve-addr, host network).
# Before 2026-11-17 a hand-made Service/ServiceMonitor with the same names pointed at port
# 9090 (nothing listens there) and had label release: prometheus, so it was never scraped.
apiVersion: v1
kind: Service
metadata:
  name: cilium-metrics
  namespace: kube-system
  labels:
    k8s-app: cilium            # matched by the ServiceMonitor below
spec:
  clusterIP: None              # headless: Prometheus scrapes each agent pod directly
  selector:
    k8s-app: cilium            # the cilium agent DaemonSet's pods
  ports:
  - name: metrics
    port: 9962
    targetPort: 9962
    protocol: TCP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cilium-metrics
  namespace: kube-system
  labels:
    release: prometheus-community   # not required any more (Prometheus selects every ServiceMonitor), kept for consistency
spec:
  selector:
    matchLabels:
      k8s-app: cilium
  namespaceSelector:
    matchNames: [kube-system]
  endpoints:
  - port: metrics
    interval: 30s
