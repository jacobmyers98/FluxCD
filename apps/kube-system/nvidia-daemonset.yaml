# NVIDIA device plugin: tells Kubernetes about the RTX 3060 so pods can request it with
#   resources.limits: { nvidia.com/gpu: 1 }
# (Plex, Tdarr node, Ollama, ...). Without this plugin the node advertises no GPU and
# such pods stay Pending.
#
# A DaemonSet runs one copy of a pod on every node (here: the one node, gameserver).
# The plugin talks to the kubelet through a socket in /var/lib/kubelet/device-plugins.
#
# Time slicing (nvidia-time-slice.yaml) makes the one GPU show up as 4 "nvidia.com/gpu",
# so up to 4 pods can hold one at the same time. They share the GPU's time and its
# 12 GB of memory: there is NO memory isolation, so one big model can starve the others.
#
# This file looks like a `kubectl get -o yaml` dump (generation, the deprecated
# annotation and many default values below). Those fields are harmless; NVIDIA's own
# manifest/Helm chart is the cleaner source if this is ever rewritten.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations:
    deprecated.daemonset.template.generation: "6"   # leftover from the dump; Kubernetes manages it
  generation: 6                                     # leftover from the dump; ignored on apply
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  revisionHistoryLimit: 10        # old versions kept for `kubectl rollout undo`
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds   # must match template.metadata.labels
  template:
    metadata:
      annotations:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      containers:
      - args:
        - --fail-on-init-error=false     # keep running (and advertise 0 GPUs) instead of crash-looping if the driver isn't ready
        - --device-list-strategy=envvar  # hand the GPU to containers via NVIDIA_VISIBLE_DEVICES
        - --pass-device-specs            # also pass the /dev/nvidia* device nodes to the container
        - --config-file=/etc/device-plugin/time-slicing.yaml   # the time-slicing config from the ConfigMap below
        env:
        - name: FAIL_ON_INIT_ERROR
          value: "false"
        image: nvcr.io/nvidia/k8s-device-plugin:v0.18.0   # pinned; not tracked by Flux image automation
        imagePullPolicy: IfNotPresent
        name: nvidia-device-plugin-ctr
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/kubelet/device-plugins   # where the kubelet's device-plugin socket lives
          name: device-plugin
        - mountPath: /etc/device-plugin                # time-slicing.yaml
          name: time-slice-cfg
      dnsPolicy: ClusterFirst
      priorityClassName: system-node-critical   # highest priority: never evicted to make room for normal pods
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:              # run even on nodes tainted "GPU only"
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
      volumes:
      - hostPath:
          path: /var/lib/kubelet/device-plugins
          type: ""
        name: device-plugin
      - configMap:
          defaultMode: 420      # 420 decimal = 0644 file mode
          items:
          - key: time-slicing.yaml
            path: time-slicing.yaml
          name: nvidia-time-slice-cfg   # apps/kube-system/nvidia-time-slice.yaml
        name: time-slice-cfg
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1         # on an update: stop the old pod, then start the new one
    type: RollingUpdate
