# A RuntimeClass names a container runtime "handler" configured in containerd on the node.
# Pods that set `runtimeClassName: nvidia` start through NVIDIA's container runtime, which
# mounts the driver libraries and /dev/nvidia* into the container. "nvidia" must match the
# runtime name in /etc/containerd/config.toml (set up by nvidia-ctk when the toolkit was
# installed). If containerd's default runtime is already nvidia, pods work without it.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia      # cluster-wide (RuntimeClasses have no namespace)
handler: nvidia     # the runtime name in containerd's config
