apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden-server
  namespace: kube-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden-server
  template:
    metadata:
      labels:
        app: vaultwarden-server
        exposed: nodeport
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.4
          env:
            - name: DOMAIN
              value: "https://vault.waffle-systems.com"
            - name: SIGNUPS_ALLOWED
              value: "false" # set to "false" after creating your account
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /alive
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          hostPath:
            path: /home/server/docker/vaultwarden-server
            type: DirectoryOrCreate

---

apiVersion: v1
kind: Service
metadata:
  name: port-service-vaultwarden
  namespace: kube-system
spec:
  type: NodePort
  selector:
    app: vaultwarden-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30009
