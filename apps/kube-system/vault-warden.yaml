apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden-server
  namespace: kube-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden-server
  template:
    metadata:
      labels:
        app: vaultwarden-server
        exposed: nodeport
    spec:
      initContainers:
        - name: fix-perms # hands the data dir to container_user (1001:1004)
          image: busybox:1.37
          securityContext:
            runAsUser: 0
          command: ["sh", "-c", "chown -R 1001:1004 /data"]
          volumeMounts:
            - mountPath: /data
              name: data
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.4
          securityContext:
            runAsUser: 1001 # container_user
            runAsGroup: 1004
          env:
            - name: ROCKET_PORT
              value: "8080" # non-root can't bind port 80
            - name: DOMAIN
              value: "https://vault.waffle-systems.com"
            - name: SIGNUPS_ALLOWED
              value: "false" # set to "false" after creating your account
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          hostPath:
            path: /home/server/docker/vaultwarden-server
            type: DirectoryOrCreate

---

apiVersion: v1
kind: Service
metadata:
  name: port-service-vaultwarden
  namespace: kube-system
spec:
  type: NodePort
  selector:
    app: vaultwarden-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30009
