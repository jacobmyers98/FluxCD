apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "default-require-mtls"
spec:
  description: "Require mTLS globally for Pods, ignoring reserved Cilium identities"
  endpointSelector:
    matchExpressions:
    - key: "k8s:io.kubernetes.pod.namespace"
      operator: Exists
    - key: "k8s:io.kubernetes.pod.namespace"
      operator: NotIn
      values:
      - kube-system
      - cilium-spire
      - flux-system
    - key: "exposed"
      operator: NotIn
      values:
      - nodeport
  ingress:
  - fromEndpoints:
    - matchLabels: {}
    authentication:
      mode: "required"
# default blanket mTLS for everything except those 3 namespaces, and =externally exposed apps exposed=nodeport

---

apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-external-nodeport
spec:
  endpointSelector:
    matchLabels:
      exposed: nodeport
  ingress:
  - fromEntities:
    - world
    - host
# blanket policy to allow nodeport to reach world and host

---

apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: media-stack-ingress
  namespace: plex
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - radarr
      - sonarr
      - qbittorrent
ingress:
  # ----------------------------------------------------
  # RULE 1: Internal Media Stack Pods MUST use mTLS 
  # ----------------------------------------------------
  - fromEndpoints:
    - matchExpressions:
      - key: "app"
        operator: In
        values:
        - prowlarr
        - radarr
        - sonarr
        - qbittorrent
    authentication:
      mode: "required"
      
  # ----------------------------------------------------
  # RULE 2: External NodePort traffic (NO mTLS)
  # ----------------------------------------------------
  - fromEntities:
    - world
    - host
    - ingress