apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "default-require-mtls"
spec:
  description: "Require mTLS globally for Pods, ignoring reserved Cilium identities"
  endpointSelector:
    matchExpressions:
    - key: "k8s:io.kubernetes.pod.namespace"
      operator: Exists
    - key: "k8s:io.kubernetes.pod.namespace"
      operator: NotIn
      values:
      - kube-system
      - cilium-spire
      - flux-system
      - kubevirt
    - key: "exposed"
      operator: NotIn
      values:
      - nodeport
  ingress:
  - fromEndpoints:
    - matchLabels: {}
    authentication:
      mode: "required"
# default blanket mTLS for everything except those 3 namespaces, and =externally exposed apps exposed=nodeport

---

apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-external-nodeport
spec:
  endpointSelector:
    matchLabels:
      exposed: nodeport
  ingress:
  - fromEntities:
    - world
    - host
    - ingress
# blanket policy to allow nodeport to reach world and host

---

apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: plex-stack-ingress
  namespace: plex
spec:
  endpointSelector:
    matchExpressions:
    - key: "app"
      operator: In
      values:
      - plex
      - qbittorrent
      - prowlarr
      - radarr
      - sonarr
      - tdarr-node
      - tdarr-server
      - overseerr
      - requestrr
  ingress:
  # ----------------------------------------------------
  # RULE 1: Internal Media Stack Pods MUST use mTLS
  # ----------------------------------------------------
  - fromEndpoints:
    - matchExpressions:
      - key: "app"
        operator: In
        values:
        - plex
        - qbittorrent
        - prowlarr
        - radarr
        - sonarr
        - tdarr-node
        - tdarr-server
        - overseerr
        - requestrr
    authentication:
      mode: "required"
  # ----------------------------------------------------
  # RULE 2: External LAN traffic (NO mTLS)
  # NOTE: If all these pods have the 'exposed: nodeport' label,
  # your 'allow-external-nodeport' ClusterWide policy already 
  # allows world/host. We only include 'ingress' here in case 
  # you are routing anything locally via an Ingress Controller.
  # ----------------------------------------------------
  - fromEntities:
    - world
    - host
    - ingress
    # Allow Homarr to talk to Plex media apps
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
        app: homarr
  # Allow Tailscale VPN traffic
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        # NOTE: Verify this label matches your Tailscale pod (e.g., app: tailscale)
        app: tailscale

---

