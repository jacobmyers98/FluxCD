apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "default-require-mtls"
spec:
  description: "Require mTLS globally, except for infrastructure and storage"
  endpointSelector:
    matchExpressions:
    - key: "k8s:io.kubernetes.pod.namespace"
      operator: NotIn
      values:
      - kube-system
      - cilium-spire
      - flux-system
    - key: "exposed"
      operator: NotIn
      values:
      - nodeport
  ingress:
  - fromEndpoints:
    - matchLabels: {}
    authentication:
      mode: "required"