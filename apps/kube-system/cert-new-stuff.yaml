      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: port-service-plex
            port:
              number: 32400
  # --- Qbittorrent ---
  - host: qbit.waffle-systems.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: port-service-qbit
            port:
              number: 8080
  # --- Overseerr ---
  - host: seerr.waffle-systems.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: port-service-seerr
            port:
              number: 5055
  # --- Prowlarr ---
  - host: prowlarr.waffle-systems.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: port-service-prowlarr
            port:
              number: 9696
  # --- Requestrr ---
  - host: requestrr.waffle-systems.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: port-service-requestrr
            port:
              number: 4545

