  # --- Prowlarr ---
  - host: prowlarr.waffle-systems.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: port-service-prowlarr
            port:
              number: 9696
  # --- Requestrr ---
  - host: requestrr.waffle-systems.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: port-service-requestrr
            port:
