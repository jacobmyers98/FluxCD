apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble-tls 
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: cilium
  tls:
  - hosts:
    - hubble.waffle-systems.com
    # The certificate will be saved to this Secret automatically
    secretName: hubble-tls 
  rules:
  - host: hubble.waffle-systems.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hubble-ui
            port:
              number: 80

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plex-tls 
  namespace: plex
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: cilium
  tls:
  - hosts:
    - radarr.waffle-systems.com
    - sonarr.waffle-systems.com
    - plex.waffle-systems.com
    - qbit.waffle-systems.com
    - seerr.waffle-systems.com
    - prowlarr.waffle-systems.com
    - requestrr.waffle-systems.com
    # The certificate will be saved to this Secret automatically
    secretName: plex-tls 
  rules:
  - host: radarr.waffle-systems.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: port-service-radarr
            port:
              number: 7878
  - host: sonarr.waffle-systems.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: port-service-sonarr
            port:
              number: 8989
  # --- Plex ---
  - host: plex.waffle-systems.com
