apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-training-pipeline
  namespace: investing
spec:
  schedule: "0 0 * * 0" # Every Sunday at Midnight
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: python-trainer
            image: python:3.11-slim
            env:
            - name: DB_URI
              value: "postgresql://postgres:password@postgres-service:5432/realestate"
            volumeMounts:
            - name: model-storage
              mountPath: /models
            - name: kaggle-storage
              mountPath: /data
            command: ["/bin/sh", "-c"]
            args:
              - |
                pip install --no-cache-dir pandas xgboost sqlalchemy psycopg2-binary requests
                
                # Fetch the script (In practice, clone from Git or build into Docker image)
                # Here we assume the script above is available at /scripts/trainer.py
                python /scripts/trainer.py
          volumes:
          - name: model-storage
            persistentVolumeClaim:
              claimName: shared-model-pvc
          - name: kaggle-storage
            persistentVolumeClaim:
              claimName: kaggle-data-pvc