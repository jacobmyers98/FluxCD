apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-analyst-app
  namespace: investing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hybrid-analyst
  template:
    metadata:
      labels:
        app: hybrid-analyst
    spec:
      containers:
      - name: analyst-ui
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install streamlit google-generativeai psycopg2-binary yfinance
            cat << 'EOF' > app.py
            import streamlit as st
            import google.generativeai as genai
            import yfinance as yf
            import os
            import time
            
            st.title("⚡ Hybrid AI Market Intelligence")
            st.write("Review model-generated daily sentiment and strategy adjustments.")
            
            ticker = st.text_input("Enter Ticker Symbol for Analysis:", value="SPY").upper()
            
            # Cache responses for 1 hour so repeat requests don't burn free-tier quota
            @st.cache_data(ttl=3600)
            def get_strategy(ticker_symbol, summary_data):
                raw_key = os.environ.get("GEMINI_API_KEY", "")
                api_key = raw_key.strip().replace('"', '').replace("'", "")
                
                if not api_key:
                    return "ERROR: Missing API Key"
                    
                genai.configure(api_key=api_key)
                model = genai.GenerativeModel('gemini-3.1-flash-lite')
                
                # Retry loop to handle 429 quota exhaustion gracefully
                for attempt in range(3):
                    try:
                        response = model.generate_content(
                            f"Act as a conservative quantitative risk manager. Analyze this data: {summary_data}. "
                            "Provide a 3-sentence draft plan: Trend observation, Target entry zone, and specific execution warning. "
                            "Format cleanly using markdown."
                        )
                        return response.text
                    except Exception as e:
                        if "429" in str(e) or "Quota exceeded" in str(e):
                            time.sleep(35) # Wait for the minute timer to reset
                        else:
                            raise e
                return "ERROR: Rate limit exceeded. Please wait 60 seconds and try again."
            
            if st.button("Generate Strategy Draft"):
                with st.spinner("Fetching 30-day telemetry and prompting Gemini..."):
                    try:
                        # 1. Pull 30 days of data
                        data = yf.Ticker(ticker).history(period="30d")
                        closes = data['Close'].tolist()
                        
                        if not closes:
                            st.error(f"Could not retrieve data for ticker {ticker}.")
                            st.stop()

                        # 2. Pre-calculate context metrics to prevent AI hallucinations
                        current_price = round(closes[-1], 2)
                        max_30d = round(max(closes), 2)
                        min_30d = round(min(closes), 2)
                        
                        # Calculate 20-day Simple Moving Average (SMA)
                        sma_20 = round(sum(closes[-20:]) / 20, 2) if len(closes) >= 20 else "N/A"
                        
                        # 3. Build a structured context payload
                        summary = (
                            f"30-Day Context for {ticker}:\n"
                            f"- Current Price: ${current_price}\n"
                            f"- 30-Day High: ${max_30d}\n"
                            f"- 30-Day Low: ${min_30d}\n"
                            f"- 20-Day SMA: ${sma_20}\n"
                            f"- Raw Closes (Oldest to Newest): {closes}"
                        )
                        
                        result = get_strategy(ticker, summary)
                        
                        if result.startswith("ERROR"):
                            st.error(result)
                        else:
                            st.subheader(f"🤖 Draft Strategy for {ticker}")
                            st.markdown(result)
                            st.info("⚠️ Review parameters thoroughly before executing trades manually in your brokerage account.")
                    except Exception as e:
                        st.error(f"Execution Error: {e}")
            EOF
            streamlit run app.py --server.port=8501 --server.address=0.0.0.0
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api
              key: GEMINI_API_KEY
        - name: DB_HOST
          value: "market-db-service"
        ports:
        - containerPort: 8501
          name: ui-port

---

apiVersion: v1
kind: Service
metadata:
  name: hybrid-analyst-service
  namespace: investing
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8501
    nodePort: 30020
  selector:
    app: hybrid-analyst
