apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-frontend
  namespace: investing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit-re-ui
  template:
    metadata:
      labels:
        app: streamlit-re-ui
    spec:
      containers:
      - name: streamlit
        image: python:3.11-slim
        ports:
        - containerPort: 8501
        volumeMounts:
        - name: model-storage
          mountPath: /models
          readOnly: true
        command: ["/bin/sh", "-c"]
        args:
          - |
            pip install --no-cache-dir streamlit xgboost pandas
            
            cat << 'EOF' > app.py
            import streamlit as st
            import xgboost as xgb
            import pandas as pd
            import os

            st.title("Property Valuation Engine")
            model_path = "/models/latest_xgb_model.json"

            if not os.path.exists(model_path):
                st.warning("Awaiting initial Kaggle data load and model compilation...")
            else:
                model = xgb.XGBRegressor()
                model.load_model(model_path)
                
                sqft = st.number_input("Square Footage", value=2200)
                beds = st.number_input("Bedrooms", value=3)
                baths = st.number_input("Bathrooms", value=2.0)
                lot = st.number_input("Lot Size", value=6500)
                year = st.number_input("Year Built", value=2010)
                
                if st.button("Analyze Property"):
                    input_df = pd.DataFrame([[sqft, beds, baths, lot, year]], columns=['sqft', 'bedrooms', 'bathrooms', 'lot_size', 'year_built'])
                    val = float(model.predict(input_df)[0])
                    st.success(f"Current Estimated Value: ${val:,.2f}")
            EOF
            
            streamlit run app.py --server.port=8501 --server.address=0.0.0.0
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: shared-model-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: real-estate-service
  namespace: investing
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8501
    nodePort: 30021
  selector:
    app: streamlit-re-ui
