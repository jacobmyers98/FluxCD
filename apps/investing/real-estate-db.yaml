apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-re-db
  namespace: investing
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres-re
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres-re
        image: postgres:15-alpine
        env:
        - name: POSTGRES_PASSWORD
          value: "password" # Use a K8s Secret in production
        - name: POSTGRES_DB
          value: "realestate"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-re-service
  namespace: investing
spec:
  ports:
  - port: 5432
  selector:
    app: postgres-re