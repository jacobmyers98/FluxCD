# Namespaces for the app folders. A Namespace is a named "folder" inside the cluster:
# names only have to be unique inside one namespace, and RBAC rules, network policies
# and resource quotas can be scoped to it.
#
# These are created here, once, instead of inside each app folder, so every folder can
# assume its namespace already exists. Not listed here: kube-system / kube-public /
# kube-node-lease / default (Kubernetes makes those), flux-system (flux bootstrap makes
# it), kubevirt (comes from the KubeVirt operator manifest) and cilium-spire (Cilium).
#
# Careful: deleting a Namespace deletes EVERYTHING inside it. Because the "admin-namespaces"
# Flux Kustomization (clusters/my-cluster/apps.yaml) has prune: true, removing a block from this file deletes that namespace
# and all of its apps. Leave these alone unless you really mean it.
#
# The "app: <name>" label is just a tag. It can be used by network policies or
# `kubectl get ns -l app=plex`; nothing requires it.
apiVersion: v1
kind: Namespace
metadata:
  name: gaming        # Minecraft + Cloudflare DDNS ("production": outside players use it)
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled   # moving to the app folders; never prune
  labels:
    app: gaming

---

apiVersion: v1
kind: Namespace
metadata:
  name: plex          # Plex and the media automation around it ("production")
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled   # moving to the app folders; never prune
  labels:
    app: plex

