apiVersion: v1
kind: Service
metadata:
  name: port-service-prowlarr
  namespace: plex
spec:
  type: NodePort
  selector:
    app: prowlarr
  ports:
    - protocol: TCP
      port: 9696
      targetPort: 9696
      nodePort: 30003
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr-service
  namespace: plex
spec:
  type: ClusterIP
  selector:
    app: prowlarr
  ports:
    - name: prowlarr-service
      port: 9696
      targetPort: 9696
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: plex
  labels:
    app: prowlarr
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      automountServiceAccountToken: false   # neither container calls the Kubernetes API
      securityContext:
        runAsUser: 1001
        runAsGroup: 1004
        fsGroup: 1004
        seccompProfile:
          type: RuntimeDefault              # block rarely used kernel calls
      initContainers:
      - name: flaresolverr
        image: ghcr.io/flaresolverr/flaresolverr:v3.5.2 # {"$imagepolicy": "flux-system:flaresolverr-policy"}
        imagePullPolicy: Always
        restartPolicy: Always
        securityContext:
          runAsUser: 1000                   # the image's own "flaresolverr" user (was root)
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        # no "ports:": FlareSolverr has no login, so it only listens inside the pod (Prowlarr uses http://localhost:8191)
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 2Gi
        env:
        - name: HOST
          value: "127.0.0.1"                # not reachable from other pods, the node, the LAN or Tailscale
        - name: LOG_LEVEL
          value: "info"
        - name: CAPTCHA_SOLVER
          value: "none"
      containers:
      - name: prowlarr
        image: linuxserver/prowlarr:3.1.0 #  {"$imagepolicy": "flux-system:prowlarr-policy"}
        env:
        - name: PUID
          value: "1001"
        - name: PGID
          value: "1004"
        - name: TZ
          value: "Etc/UTC"
        ports:
        - containerPort: 9696
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 800m
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        hostPath:
          path: /home/server/docker/prowlarr/
          type: Directory
