# Weekly qBittorrent restart (a scheduled "turn it off and on again"; the restart also
# re-runs the init container that checks the VPN). A CronJob runs kubectl inside the cluster, so it needs its own identity with
# permission to restart Deployments in the plex namespace, and nothing more:
#   ServiceAccount (identity) → RoleBinding → Role (allowed actions).

# The identity the CronJob's pod runs as.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-restarter-sa
  namespace: plex
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-restarter-role
  namespace: plex
# What it may do: read and patch Deployments in plex only (a Role is namespace-scoped).
# `rollout restart` works by patching a timestamp annotation onto the pod template.
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
# Gives the Role to the ServiceAccount.
metadata:
  name: deployment-restarter-binding
  namespace: plex
subjects:
  - kind: ServiceAccount
    name: deployment-restarter-sa
    namespace: plex
roleRef:
  kind: Role
  name: deployment-restarter-role
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: batch/v1
kind: CronJob
metadata:
  name: qbittorrent-restarter
  namespace: plex
spec:
  schedule: "0 0 * * 0" # Every Sunday at 00:00 (no timeZone set: kube-controller-manager's clock, normally UTC)
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: deployment-restarter-sa   # run with the permissions above
          containers:
          - name: kubectl
            # Official image (Bitnami stopped publishing free images in 2025). It has no shell; the entrypoint is kubectl.
            image: registry.k8s.io/kubectl:v1.37.2 # {"$imagepolicy": "flux-system:kubectl-policy"}
            args: ["rollout", "restart", "deployment", "-l", "app=qbittorrent", "-n", "plex"]
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 128Mi
          restartPolicy: OnFailure   # retry the kubectl call if it fails
