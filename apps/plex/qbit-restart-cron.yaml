apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-restarter-sa
  namespace: plex
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-restarter-role
  namespace: plex
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-restarter-binding
  namespace: plex
subjects:
  - kind: ServiceAccount
    name: deployment-restarter-sa
    namespace: plex
roleRef:
  kind: Role
  name: deployment-restarter-role
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: batch/v1
kind: CronJob
metadata:
  name: qbittorrent-restarter
  namespace: plex
spec:
  schedule: "0 0 * * 0" # Every Sunday at 00:00
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: deployment-restarter-sa
          containers:
          - name: kubectl
            # Official image (Bitnami stopped publishing free images in 2025). It has no shell; the entrypoint is kubectl.
            image: registry.k8s.io/kubectl:v1.37.2 # {"$imagepolicy": "plex:kubectl-policy"}
            args: ["rollout", "restart", "deployment", "-l", "app=qbittorrent", "-n", "plex"]
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 128Mi
          restartPolicy: OnFailure
