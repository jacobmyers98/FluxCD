apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr-server
  namespace: plex
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: tdarr-server
  template:
    metadata:
      labels:
        app: tdarr-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tdarr-server
          image: ghcr.io/haveagitgat/tdarr:3.10.00 #  {"$imagepolicy": "flux-system:tdarr-policy"}
          env:
            - name: serverIP
              value: "0.0.0.0"
            - name: serverPort
              value: "8266"
            - name: webUIPort
              value: "8265"
            - name: internalNode
              value: "false"
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1004"
            - name: apiKey
              valueFrom:
                secretKeyRef:
                  name: tdarr-api-secret
                  key: apiKey
          ports:
            - containerPort: 8265
            - containerPort: 8266
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2
              memory: 1Gi
          volumeMounts:
            - name: tdarr-config
              mountPath: /app/server
            # Only the folders Tdarr should transcode (since 2026-11-27). It used to mount all of /mnt/Media and
            # re-encoded Immich originals and seeding torrents. Paths inside the pod stay /media/<folder>, so the
            # library ("/media") and cache ("/media/Transcode-cache") settings are unchanged.
            - name: media-movies
              mountPath: /media/Movies
            - name: media-tv-shows
              mountPath: /media/TV_Shows
            - name: media-videos
              mountPath: /media/Videos
            - name: media-transcode-cache
              mountPath: /media/Transcode-cache
      volumes:
        - name: tdarr-config
          hostPath:
            path: /home/server/docker/tdarr/config
            type: DirectoryOrCreate
        - name: media-movies
          hostPath:
            path: /mnt/Media/Movies
            type: Directory
        - name: media-tv-shows
          hostPath:
            path: /mnt/Media/TV_Shows
            type: Directory
        - name: media-videos
          hostPath:
            path: /mnt/Media/Videos
            type: Directory
        - name: media-transcode-cache
          hostPath:
            path: /mnt/Media/Transcode-cache
            type: Directory

---

apiVersion: v1
kind: Service
metadata:
  name: port-service-tdarr-server
  namespace: plex
spec:
  type: ClusterIP   # reached via the HTTPS Ingress; was NodePort 30017 (+ 30774 for 8266) until 2026-11-25
  selector:
    app: tdarr-server
  ports:
    - name: tdarr-webui-port
      port: 8265
      targetPort: 8265
    - name: server
      port: 8266
      targetPort: 8266

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr-node
  namespace: plex
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: tdarr-node
  template:
    metadata:
      labels:
        app: tdarr-node
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: tdarr-checker
          image: curlimages/curl:8.23.0 # {"$imagepolicy": "flux-system:curl-policy"}
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Tdarr Server..."
              until curl -s http://port-service-tdarr-server.plex.svc:8265/api/v2/status > /dev/null; do
                echo "Tdarr Server is unavailable - sleeping"
                sleep 2
              done
              echo "Tdarr Server is up!"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: tdarr-node
          image: ghcr.io/haveagitgat/tdarr_node:3.10.00 #  {"$imagepolicy": "flux-system:tdarr-node-policy"}
          env:
            - name: nodeName
              value: "k8s-node-1"
            - name: serverURL
              value: "http://port-service-tdarr-server:8266"
            - name: nodePort
              value: "8267"
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1004"
            - name: apiKey
              valueFrom:
                secretKeyRef:
                  name: tdarr-api-secret
                  key: apiKey
          ports:
            - containerPort: 8267
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "4"
              memory: 4Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: tdarr-config
              mountPath: /app/configs
            # Only the folders Tdarr should transcode (since 2026-11-27). It used to mount all of /mnt/Media and
            # re-encoded Immich originals and seeding torrents. Paths inside the pod stay /media/<folder>, so the
            # library ("/media") and cache ("/media/Transcode-cache") settings are unchanged.
            - name: media-movies
              mountPath: /media/Movies
            - name: media-tv-shows
              mountPath: /media/TV_Shows
            - name: media-videos
              mountPath: /media/Videos
            - name: media-transcode-cache
              mountPath: /media/Transcode-cache
      volumes:
        - name: tdarr-config
          hostPath:
            path: /home/server/docker/tdarr/config
            type: DirectoryOrCreate
        - name: media-movies
          hostPath:
            path: /mnt/Media/Movies
            type: Directory
        - name: media-tv-shows
          hostPath:
            path: /mnt/Media/TV_Shows
            type: Directory
        - name: media-videos
          hostPath:
            path: /mnt/Media/Videos
            type: Directory
        - name: media-transcode-cache
          hostPath:
            path: /mnt/Media/Transcode-cache
            type: Directory

---

apiVersion: v1
kind: Service
metadata:
  name: port-service-tdarr-node
  namespace: plex
spec:
  type: ClusterIP
  selector:
    app: tdarr-node
  ports:
    - name: tdarr-node
      port: 8267
      targetPort: 8267
