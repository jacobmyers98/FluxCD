apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr-server
  namespace: plex
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: tdarr-server
  template:
    metadata:
      labels:
        app: tdarr-server
        exposed: nodeport
    spec:
      containers:
        - name: tdarr-server
          image: ghcr.io/haveagitgat/tdarr:3.02.00 #  {"$imagepolicy": "plex:tdarr-policy"}
          env:
            - name: serverIP
              value: "0.0.0.0"
            - name: serverPort
              value: "8266"
            - name: webUIPort
              value: "8265"
            - name: internalNode
              value: "false"
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1004"
            - name: apiKey
              valueFrom:
                secretKeyRef:
                  name: tdarr-api-secret
                  key: apiKey
          ports:
            - containerPort: 8265
            - containerPort: 8266
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2
              memory: 1Gi
          volumeMounts:
            - name: tdarr-config
              mountPath: /app/server
            - name: tdarr-media
              mountPath: /media
      volumes:
        - name: tdarr-config
          hostPath:
            path: /home/server/docker/tdarr/config
            type: DirectoryOrCreate
        - name: tdarr-media
          hostPath:
            path: /mnt/Media
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: port-service-tdarr-server
  namespace: plex
spec:
  type: NodePort
  selector:
    app: tdarr-server
  ports:
    - name: tdarr-webui-port
      port: 8265
      targetPort: 8265
      nodePort: 30017
    - name: server
      port: 8266
      targetPort: 8266
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr-node
  namespace: plex
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: tdarr-node
  template:
    metadata:
      labels:
        app: tdarr-node
        exposed: nodeport
    spec:
      initContainers:
        - name: tdarr-checker
          image: curlimages/curl:8.5.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Tdarr Server..."
              until curl -s http://port-service-tdarr-server.plex.svc:8265/api/v2/status > /dev/null; do
                echo "Tdarr Server is unavailable - sleeping"
                sleep 2
              done
              echo "Tdarr Server is up!"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: tdarr-node
          image: ghcr.io/haveagitgat/tdarr_node:3.02.00 #  {"$imagepolicy": "plex:tdarr-node-policy"}
          env:
            - name: nodeName
              value: "k8s-node-1"
            - name: serverURL
              value: "http://port-service-tdarr-server:8266"
            - name: nodePort
              value: "8267"
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1004"
            - name: apiKey
              valueFrom:
                secretKeyRef:
                  name: tdarr-api-secret
                  key: apiKey
          ports:
            - containerPort: 8267
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "4"
              memory: 4Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: tdarr-config
              mountPath: /app/configs
            - name: tdarr-media
              mountPath: /media
      volumes:
        - name: tdarr-config
          hostPath:
            path: /home/server/docker/tdarr/config
            type: DirectoryOrCreate
        - name: tdarr-media
          hostPath:
            path: /mnt/Media
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: port-service-tdarr-node
  namespace: plex
spec:
  type: ClusterIP
  selector:
    app: tdarr-node
  ports:
    - name: tdarr-node
      port: 8267
      targetPort: 8267
