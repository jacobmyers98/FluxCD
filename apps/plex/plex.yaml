apiVersion: v1
kind: Service
metadata:
  name: port-service-plex
  namespace: plex
  labels:
    app: plex
spec:
  ports:
    - name: plex-port
      port: 32400
      targetPort: 32400
      nodePort: 30013
  selector:
    app: plex
  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: plex
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
        exposed: nodeport
    spec:
      automountServiceAccountToken: false   # the app never calls the Kubernetes API
      securityContext:
        runAsUser: 1001
        runAsGroup: 1004
        fsGroup: 1004
        seccompProfile:
          type: RuntimeDefault              # block rarely used kernel calls
      containers:
        - name: plex
          image: lscr.io/linuxserver/plex:1.43.3
          ports:
            - containerPort: 32400
          # no container securityContext: the linuxserver s6 init must fix /run's owner at start
          # (allowPrivilegeEscalation: false -> "/run belongs to uid 0 instead of 1001", crash loop)
          env:
            - name: PUID
              value: "1001"
            - name: PGID
              value: "1004"
            - name: VERSION
              value: "docker"
            - name: PLEX_CLAIM
              valueFrom:
                secretKeyRef:
                  name: plex-secret
                  key: claim-token
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 4
              memory: 6Gi
          volumeMounts:
            - mountPath: /config
              name: plex-config
            - mountPath: /data
              name: media-data
              readOnly: true   # Plex only reads the library ("allow media deletion" is off)
      volumes:
        - name: plex-config
          hostPath:
            path: /home/server/docker/plex/config
            type: DirectoryOrCreate
        - name: media-data
          hostPath:
            path: /mnt/Media
            type: Directory
