apiVersion: v1
kind: Service
metadata:
  name: port-service-jackett
  namespace: plex
  labels:
    app: jackett
spec:
  ports:
    - name: jackett-port
      port: 9117
      targetPort: 9117
      nodePort: 30003
  selector:
    app: jackett
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jackett
  namespace: plex
  labels:
    app: jackett
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: jackett
  template:
    metadata:
      labels:
        app: jackett
    spec:
      containers:
      - name: jackett
        image: linuxserver/jackett:0.24.1012 # {"$imagepolicy": "plex:jackett-policy"}
        imagePullPolicy: Always
        ports:
        - containerPort: 9117
        volumeMounts:
        - mountPath: /config
          name: jackett-config
        - mountPath: /mnt/Media
          name: movies-shows-raid
        - mountPath: /downloads
          name: torrent-downloads
      volumes:
      - name: jackett-config
        hostPath:
          path: /home/server/docker/jackett/config
          type: Directory
      - name: movies-shows-raid
        hostPath:
          path: /mnt/Media
          type: Directory
      - name: torrent-downloads
        hostPath:
          path: /mnt/Media/Torrent
          type: Directory
