apiVersion: v1
kind: Service
metadata:
  name: port-service-qbit
  namespace: plex
  labels:
    app: qbittorrent
spec:
  ports:
    - name: qbittorrent-port
      protocol: TCP
      port: 8080
      targetPort: 8080
    # torrent port 34567 removed: peers reach qBittorrent through the VPN (gluetun), never through this Service
  selector:
    app: qbittorrent
  type: ClusterIP   # reached via the HTTPS Ingress; was NodePort 30004-30006 until 2026-11-25
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: plex
  labels:
    app: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      hostname: qbit-server
      initContainers:
      # ---------------------------------------------------------
      # INIT 1: GLUETUN (Native K8s Sidecar)
      # Starts first and runs in the background
      # ---------------------------------------------------------
      - name: gluetun
        image: qmcgaw/gluetun:v3.41.3 # {"$imagepolicy": "flux-system:gluetun-policy"}
        imagePullPolicy: Always
        restartPolicy: Always
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        env:
        - name: VPN_SERVICE_PROVIDER
          value: "custom"
        - name: VPN_TYPE
          value: "wireguard"
        - name: DOT
          value: "off"
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: "10.96.0.0/12,10.244.0.0/16,192.168.1.0/24"
        - name: FIREWALL_INPUT_PORTS
          value: "8080,34567"
        ports:
        - containerPort: 8080
          name: webui
          protocol: TCP
        - containerPort: 34567
          name: torrent-tcp
          protocol: TCP
        - containerPort: 34567
          name: torrent-udp
          protocol: UDP
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: wireguard-config
          mountPath: /gluetun/wireguard/wg0.conf
          subPath: wg0.conf
      # ---------------------------------------------------------
      # INIT 2: VPN CHECKER
      # Waits until the VPN routes traffic before letting qBit start
      # ---------------------------------------------------------
      - name: vpn-check
        image: busybox:1.38.0 # {"$imagepolicy": "flux-system:busybox-policy"}
        command:
        - 'sh'
        - '-c'
        # Tries to hit an external IP checker. Loops until successful.
        - 'until wget -qO- https://ifconfig.me; do echo "Waiting for VPN connectivity..."; sleep 2; done; echo " VPN is up!"'
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      # ---------------------------------------------------------
      # MAIN CONTAINER: LINUXSERVER QBITTORRENT (The App)
      # Starts only after vpn-check successfully exits
      # ---------------------------------------------------------
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:5.3.1 #  {"$imagepolicy": "flux-system:qbittorrent-policy"}
        imagePullPolicy: Always
        env:
        - name: PUID
          value: "1001"
        - name: PGID
          value: "1004"
        - name: TZ
          value: "America/Denver"
        - name: WEBUI_PORT
          value: "8080"
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 2
            memory: 2Gi
        volumeMounts:
        - name: qbit-config
          mountPath: /config
        - name: torrent-downloads
          mountPath: /downloads
        - name: movies-shows-raid
          mountPath: /mnt/Media
      volumes:
      - name: qbit-config
        hostPath:
          path: /home/server/docker/qbittorrent/
          type: Directory
      - name: torrent-downloads
        hostPath:
          path: /mnt/Media/Torrent
          type: Directory
      - name: movies-shows-raid
        hostPath:
          path: /mnt/Media
          type: Directory
      - name: wireguard-config
        secret:
          secretName: qbit-wireguard-config
