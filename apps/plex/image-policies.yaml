# Flux image automation, step by step:
#   1. ImageRepository: Flux's image-reflector-controller lists the image's tags in the
#      registry every `interval`.
#   2. ImagePolicy: picks the "latest" allowed tag from that list (semver range, or a
#      tag pattern). `kubectl -n <ns> get imagepolicy` shows what it picked.
#   3. A setter comment on the image line in a manifest, e.g.
#        image: foo/bar:1.2.3 # {"$imagepolicy": "<namespace>:<policy-name>"}
#      marks where that tag belongs.
#   4. ImageUpdateAutomation (image-update-automation.yaml) rewrites those lines in git
#      and pushes a commit to main; Flux then deploys it like any other change.
# A semver range like ">=1.2.0" has no upper limit, so it also takes new MAJOR versions
# (which may need manual migration steps). "<2.0.0" stops at the major. Plain semver
# never picks pre-releases (-rc, -beta, ...) unless the range itself asks for them.
#
# plex: the policies; their ImageRepositories are in image-repositories.yaml.
# These apps are used by other people ("production"), and most ranges have no upper
# limit, so major upgrades arrive automatically within a few hours of release.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: radarr-policy
  namespace: plex
spec:
  imageRepositoryRef:
    name: radarr
  policy:
    semver:
      range: ">=5.27.0"           # Radarr, majors included

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sonarr-policy
  namespace: plex
spec:
  imageRepositoryRef:
    name: sonarr
  policy:
    semver:
      range: ">=4.0.14"           # Sonarr, majors included

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: prowlarr-policy
  namespace: plex
spec:
  imageRepositoryRef:
    name: prowlarr
  policy:
    semver:
      range: ">=2.3.0"            # Prowlarr, majors included (2.x → 3.0.2 arrived this way)

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: seerr-policy
  namespace: plex
spec:
  imageRepositoryRef:
    name: seerr
  policy:
    semver:
      range: ">=v3.4.1"           # Seerr (tags start with "v")

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: qbittorrent-policy
  namespace: plex
spec:
  imageRepositoryRef:
    name: qbittorrent
  policy:
    semver:
      range: ">=5.2.3 <9.0.0"     # qBittorrent; the upper limit skips linuxserver's old date-style tags (e.g. 20.04.1)

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: tdarr-policy
  namespace: plex
spec:
  imageRepositoryRef:
    name: tdarr
  policy:
    semver:
      range: ">=2.86.01"          # Tdarr server; keep it on the same version as tdarr-node

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: tdarr-node-policy
  namespace: plex
spec:
  imageRepositoryRef:
    name: tdarr-node
  policy:
    semver:
      range: ">=2.86.01"          # Tdarr node (must match the server's version)

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cloudflared-policy
  namespace: plex
spec:
  imageRepositoryRef:
    name: cloudflared
  policy:
    semver:
      range: ">=2026.10.3"        # cloudflared uses date versions (YYYY.MM.patch)

---
# kubectl for the qbittorrent-restarter CronJob. Stays on the cluster's minor version;
# raise the range when the cluster is upgraded.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: kubectl-policy
  namespace: plex
spec:
  imageRepositoryRef:
    name: kubectl
  policy:
    semver:
      range: ">=1.37.0 <1.38.0"
