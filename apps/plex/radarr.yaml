apiVersion: v1
kind: Service
metadata:
  name: port-service-radarr
  namespace: plex
  labels:
    app: radarr
spec:
  ports:
    - name: radarr-port
      port: 7878
      targetPort: 7878
  selector:
    app: radarr
  type: ClusterIP   # reached via the HTTPS Ingress; was NodePort 30001 until 2026-11-25
---
apiVersion: apps/v1 #kubectl api-resources | grep {kind}
kind: Deployment
metadata:
  name: radarr
  namespace: plex
  labels:
    app: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
      - name: radarr
        image: linuxserver/radarr:7.0.3 #  {"$imagepolicy": "flux-system:radarr-policy"}
        imagePullPolicy: Always
        env:
        - name: PUID
          value: "1001"
        - name: PGID
          value: "1004"
        - name: TZ
          value: "America/Denver"
        ports:
        - containerPort: 7878
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 1Gi
        volumeMounts:
        - mountPath: /config
          name: radarr-config
        - mountPath: /mnt/Media
          name: movies-shows-raid
        - mountPath: /downloads
          name: torrent-downloads
      volumes:
      - name: radarr-config
        hostPath:
          path: /home/server/docker/radarr/config
          type: Directory
      - name: movies-shows-raid
        hostPath:
          path: /mnt/Media
          type: Directory
      - name: torrent-downloads
        hostPath:
          path: /mnt/Media/Torrent
          type: Directory
