# plex namespace: media server + automation (used by outside users: treat as production).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml                # this folder's Namespace (never pruned)
  - plex.yaml
  - qbittorrent.yaml              # download client behind a Gluetun VPN sidecar
  - qbit-restart-cron.yaml        # weekly qBittorrent restart
  - radarr.yaml                   # movies
  - sonarr.yaml                   # TV
  - tdarr.yaml                    # GPU transcoding (server + node)
  - prowlarr.yaml                 # indexer manager (+ FlareSolverr)
  - cloudflare.yaml               # cloudflared tunnel for outside access
  - seerr.yaml                    # request portal
  - secret.qbit.yaml              # VPN (WireGuard) settings (SOPS)
  - secret.plex.yaml              # Plex claim/token (SOPS)
  - secret.tdarr.yaml             # Tdarr API key (SOPS)
  - secret.cloudflare.yaml        # tunnel token (SOPS)
