# monitoring namespace: metrics/logs plus self-hosted tools.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml              # Helm charts: TeslaMate, Mosquitto, Loki, Alloy, DCGM, kube-prometheus-stack, prometheus-adapter
  - helmrepo.yaml                 # where those charts come from
  - teslamate-service.yaml        # Service for TeslaMate (ClusterIP; HTTPS via the Ingress)
  - teslamate-pv.yaml             # storage for TeslaMate's Postgres and Mosquitto
  - prometheus-pv.yaml
  - loki-pv.yaml
  - secret.teslamate.yaml         # TeslaMate encryption key (SOPS)
  - secret.postgresql.yaml        # TeslaMate Postgres password (SOPS)
  - secret.alert-manager.yaml
  - homarr.yaml                   # Homarr dashboard
  - grafana-service.yaml          # Service for Grafana (ClusterIP; HTTPS via the Ingress)
  - secret.grafana.yaml           # Grafana admin login (SOPS)
  - glances.yaml                  # host stats web UI
  - snapotter.yaml                # image/file processing toolkit
  - mealie.yaml                   # recipe manager
  - metrics-reader.yaml           # lets view/edit/admin read kubectl-top metrics (prometheus-adapter)
