# Headlamp: Kubernetes web UI, used to browse Trivy findings (Kubescape plugin commented out).
# Plugins are installed at startup by the chart's plugin manager sidecar.
# Login: paste the token from secret monitoring/headlamp-viewer-token
#   kubectl -n monitoring get secret headlamp-viewer-token -o jsonpath='{.data.token}' | base64 -d
# The token is read-only (view + security reports), and cannot read Secrets.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 6h
  url: https://kubernetes-sigs.github.io/headlamp/

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: headlamp
      version: "0.46.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  values:
    fullnameOverride: headlamp
    # No cluster-admin for the pod's own account: every user logs in with a token.
    clusterRoleBinding:
      create: false
    podLabels:
      app: headlamp
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    config:
      watchPlugins: true
    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: headlamp_trivy
            source: https://artifacthub.io/packages/headlamp/headlamp-trivy/headlamp_trivy
            version: 0.3.2
          # Kubescape disabled 2026-11-14 (see apps/compliance/helmrelease.yaml):
          # - name: headlamp_kubescape
          #   source: https://artifacthub.io/packages/headlamp/kubescape-headlamp-plugin/headlamp_kubescape
          #   version: 0.11.2
        installOptions:
          parallel: true
          maxConcurrent: 2
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

---

# Read-only login for Headlamp: built-in "view" plus the cluster-scoped and
# security-report resources that "view" leaves out. No Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-viewer
  namespace: monitoring

---

apiVersion: v1
kind: Secret
metadata:
  name: headlamp-viewer-token
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: headlamp-viewer
type: kubernetes.io/service-account-token

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-viewer-extra
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["spdx.softwarecomposition.kubescape.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp-viewer
    namespace: monitoring

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-viewer-extra
subjects:
  - kind: ServiceAccount
    name: headlamp-viewer
    namespace: monitoring

---

# Only the ingress (and tailscale) may reach Headlamp. It may talk to the
# API server, DNS, and the internet (plugin downloads from Artifact Hub/GitHub).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headlamp
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app: headlamp
  ingress:
    - fromEntities:
        - ingress
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            app: tailscale
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
