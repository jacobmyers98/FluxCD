apiVersion: v1
kind: Service
metadata:
  name: port-service-grafana
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: prometheus-community
    app.kubernetes.io/name: grafana
  ports:
    - name: grafana-port
      protocol: TCP
      port: 80 
      targetPort: 3000
      nodePort: 30008
