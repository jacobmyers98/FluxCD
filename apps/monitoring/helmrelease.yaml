# Helm-chart apps in the monitoring namespace. Each block is a HelmRelease: "install this
# chart, at this version, with these values, and keep it that way". Flux's helm-controller
# runs the `helm install/upgrade` for you and re-checks every `interval`.
#   flux get hr -n monitoring                  status of each release
#   flux reconcile hr <name> -n monitoring     apply a change now
#   helm -n monitoring get values <release>    what Helm actually received
# `values:` = the chart's values.yaml overrides; each chart's own values.yaml lists all options.
#
# Version ranges like ">=7.2.0" have no upper limit, so new MAJOR chart versions install
# on their own (kube-prometheus-stack went 88 → 93, Loki 18 → 21 this way), and none of
# these has upgrade remediation (automatic retry/rollback). See FLUX_TODO.md #2.
#
# Contents: teslamate, mosquitto, loki, alloy, dcgm-exporter, prometheus-community
# (kube-prometheus-stack: Prometheus + Grafana + Alertmanager + exporters), prometheus-adapter.

# ---- TeslaMate: logs the car's drives, charging and state into PostgreSQL ------------------
# The car's data arrives from Tesla's API; TeslaMate stores it in its own Postgres (bundled
# Bitnami sub-chart below) and also publishes live values to MQTT (Mosquitto, next release).
# Web UI: ClusterIP service in teslamate-service.yaml, reached via https://teslamate.waffle-systems.com.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teslamate
  namespace: monitoring
  annotations:
    image.toolkit.fluxcd.io/image-ref: teslamate   # informational only; no Flux controller reads this annotation
spec:
  interval: 1h
  releaseName: teslamate
  chart:
    spec:
      chart: teslamate
      version: ">=7.2.0"       # chart version (not the app version); live 7.2.0
      sourceRef:
        kind: HelmRepository
        name: teslamate
        namespace: flux-system
  install:
    createNamespace: true   # create the namespace if it doesn't exist (it does)
  values:
    podLabels:
      app: teslamate         # selected by Cilium policy monitoring-stack-ingress (HTTPS via the Ingress, mTLS from other pods)
    image:
      repository: teslamate/teslamate
      tag: "4.4.0"            # app version, pinned; not tracked by Flux image automation
    env:
      - name: TZ
        value: UTC                 # times are stored in UTC; Grafana shows them in your browser's zone
      - name: DATABASE_HOST
        value: '{{ include "common.names.fullname" .}}-postgresql'   # Helm template: the bundled Postgres Service's name
      - name: DATABASE_USER
        value: postgres
      - name: DATABASE_PASS
        valueFrom:
          secretKeyRef:
            name: teslamate-password
            key: teslamate-pass
      - name: DATABASE_NAME
        value: "{{ .Values.postgresql.auth.database }}"
      - name: DISABLE_MQTT
        value: "false"
      - name: MQTT_HOST
        value: "mosquitto"         # the Mosquitto Service in this namespace

      - name: ENCRYPTION_KEY       # encrypts the stored Tesla API tokens (secret.teslamate.yaml). Losing it = log in to Tesla again
        valueFrom:
          secretKeyRef:
            name: teslamate-secret
            key: encryption-key
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 1Gi
    ingress:
      main:
        enabled: false             # the Ingress is in apps/network/ingresses.yaml instead
    persistence:
      import:                      # folder for importing TeslaFi CSV exports; this is the mount the pod actually gets
        enabled: true
        type: hostPath
        hostPath: /home/server/docker/teslamate/teslamate
        mountPath: /opt/app/import
    postgresql:                    # bundled Bitnami PostgreSQL sub-chart (TeslaMate's database)
      enabled: true
      image:
        # Must be a Bitnami image: the chart's bundled sub-chart (Bitnami postgresql 11.9.13)
        # relies on Bitnami's startup scripts and paths, so the official `postgres` image won't work.
        # Bitnami deleted the free tags from bitnami/* in 2025 (bitnami/postgresql:17.6.0 = 404);
        # the old tags live on, frozen (no security fixes), under bitnamilegacy/*. Same digest
        # as before (sha256:94c1485…). Long term: official postgres as its own Deployment. FLUX_TODO.md
        repository: bitnamilegacy/postgresql
        tag: "17.6.0"
        digest: ""
        pullPolicy: IfNotPresent
      primary:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 2Gi
        persistence:
          enabled: true
          existingClaim: teslamate-postgres-pvc   # hand-made PVC → hostPath PV (teslamate-pv.yaml)
      auth:
        existingSecret: teslamate-password   # postgres password (secret.postgresql.yaml, SOPS)
        secretKeys:
          adminPasswordKey: teslamate-pass
        database: teslamate

---
# ---- Mosquitto: MQTT message broker -----------------------------------------------------
# TeslaMate publishes live car values to it (topics teslamate/cars/1/...); anything on the
# cluster network (e.g. a home-automation tool) could subscribe. Port 1883, no TLS.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: monitoring
  annotations:
    image.toolkit.fluxcd.io/image-ref: mosquitto   # informational only; no Flux controller reads this annotation
spec:
  interval: 1h
  releaseName: mosquitto
  chart:
    spec:
      chart: mosquitto
      version: ">=2.4.1"
      sourceRef:
        kind: HelmRepository
        name: mosquitto
        namespace: flux-system
  values:
    service:
      type: ClusterIP              # only reachable inside the cluster
      externalTrafficPolicy: null  # cleared: the chart's default only makes sense for LoadBalancer/NodePort
      annotations: {}
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 200m
        memory: 64Mi

---
# ---- Loki: log database ------------------------------------------------------------------
# Stores logs pushed by Alloy (next release) and answers LogQL queries from Grafana
# (Explore → Loki). Runs as one "single binary" pod: fine for one node, no object storage.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
  annotations:
    image.toolkit.fluxcd.io/image-ref: loki   # informational only; no Flux controller reads this annotation
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: ">=18.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    createNamespace: true
  values:
    deploymentMode: SingleBinary   # everything in one process (vs. the scalable read/write/backend split)
    backend:                       # the scalable-mode components are turned off (0 replicas)
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ruler:
      enabled: false               # no log-based alert rules
    # Memcached caches are overkill for single-binary and request lots of memory
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    ingester:
      wal:
        enabled: true              # write-ahead log: logs not yet flushed to chunks survive a restart
    singleBinary:
      replicas: 1
      # Meant to put Loki's data dir /var/loki on a host folder. It does NOT work (checked
      # 2026-11-17): the volume is added to the pod but the mount below is ignored, and
      # /var/loki is the chart's "storage" emptyDir, so logs are lost when Loki restarts.
      # (The host folder was never created.) See FLUX_TODO.md.
      extraVolumes:
        - name: var-loki
          hostPath:
            path: /home/server/docker/monitoring/loki
            type: DirectoryOrCreate
      extraVolumeMounts:
        - name: var-loki
          mountPath: /var/loki
      persistence:
        enabled: false             # no PVC → the chart mounts an emptyDir at /var/loki
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1
          memory: 1Gi
    loki:
      auth_enabled: false          # single tenant: no X-Scope-OrgID header needed
      commonConfig:
        replication_factor: 1      # one copy of each log stream (one node)
      limits_config:
        retention_period: 240h      # 10 days; older logs are deleted by the compactor
      compactor:                   # merges index files and enforces retention
        retention_enabled: true
        delete_request_store: filesystem
        working_directory: /var/loki/compactor
      storage:
        type: filesystem           # chunks are plain files under /var/loki (no S3/GCS)
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
          admin: loki-admin
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      schemaConfig:                # on-disk format. Never edit an existing entry; add a new one with a future "from" date to migrate
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
    gateway:                       # nginx in front of Loki; Grafana/Alloy can use one URL for reads and writes
      enabled: true
      deploymentStrategy:
        type: Recreate
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
    lokiCanary:                    # writes test log lines and checks they can be read back (health metrics)
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    sidecar:                       # loads rule ConfigMaps into Loki (unused while the ruler is off)
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

---
# ---- Alloy: log collector -----------------------------------------------------------------
# Grafana Alloy (successor of Promtail / Grafana Agent) runs on every node, reads the host's
# syslog and all pods' logs, adds labels and pushes them to Loki. Its config is written in
# Alloy's own language (the configMap.content block below).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
  annotations:
    image.toolkit.fluxcd.io/image-ref: alloy   # informational only; no Flux controller reads this annotation
spec:
  chart:
    spec:
      chart: alloy
      version: ">=1.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  interval: 10m                    # checked more often than the others (no particular reason needed)
  values:
    controller:
      type: daemonset              # one Alloy pod per node, so it can read that node's files
    rbac:
      create: true                 # permission to list pods (for discovery.kubernetes below)
    alloy:
      mounts:
        varlog: true               # mount the host's /var/log (syslog)
        dockercontainers: true     # /var/lib/docker/containers; unused (pod logs are read via the API below)
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 1
          memory: 512Mi
      configMap:
        # The block below is Alloy config, not YAML (comments inside it would become part of
        # the config). It wires up: syslog file → Loki, and Kubernetes pod discovery →
        # relabel (keep this node's pods; add namespace/pod/container/app/node labels) →
        # read their logs through the Kubernetes API → Loki. Every log line gets the
        # label cluster="home" (until 2026-11-17 it was "eu-west-1-prod", a placeholder from an example).
        # The node name comes from K8S_NODE_NAME, which the chart sets on the pod. (Until
        # 2026-11-17 this read NODE_NAME, which doesn't exist: the node filter then kept
        # no pods, so Loki only ever had syslog.)
        content: |-
          loki.write "loki" {
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
            external_labels = { cluster = "home" }
          }

          // Node syslog
          loki.source.file "host_syslogs" {
            targets = [{
              __path__ = "/var/log/syslog",
              host     = sys.env("K8S_NODE_NAME"),
              job      = "host-syslogs",
            }]
            forward_to = [loki.write.loki.receiver]
          }

          // Kubernetes pod logs (only pods on this node, to avoid duplicates)
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              regex         = sys.env("K8S_NODE_NAME")
              action        = "keep"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.write.loki.receiver]
          }

---
# ---- DCGM exporter: GPU metrics ------------------------------------------------------------
# NVIDIA's exporter publishes the RTX 3060's usage, memory, temperature and power as
# Prometheus metrics (DCGM_FI_*), shown in Grafana's GPU dashboard.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dcgm-exporter
  namespace: monitoring
  annotations:
    image.toolkit.fluxcd.io/image-ref: dcgm-exporter   # informational only; no Flux controller reads this annotation
spec:
  interval: 1h
  releaseName: dcgm-exporter
  chart:
    spec:
      chart: dcgm-exporter
      version: ">=4.8.3"
      sourceRef:
        kind: HelmRepository
        name: dcgm-exporter
        namespace: flux-system
  values:
    serviceMonitor:                # tell Prometheus to scrape it
      enabled: true
      additionalLabels:
        release: prometheus-community   # Prometheus only picks up ServiceMonitors with this label

---
# ---- kube-prometheus-stack: Prometheus, Grafana, Alertmanager and exporters ---------------
# One chart that installs:
#   - prometheus-operator: manages Prometheus/Alertmanager from CRDs (ServiceMonitor,
#     PodMonitor, PrometheusRule, ...)
#   - Prometheus: scrapes /metrics endpoints every 30 s and stores the time series
#   - Alertmanager: sends alerts from rules (no receivers are configured here)
#   - Grafana: dashboards (provisioned from a host folder, see below)
#   - kube-state-metrics (object state) and node-exporter (host CPU/RAM/disk/network)
#   - a set of default alert/recording rules
# Prometheus scrapes every ServiceMonitor (serviceMonitorSelectorNilUsesHelmValues: false below);
# PodMonitors still need the label release: prometheus-community (the chart's default selector).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-community
  namespace: monitoring
  annotations:
    image.toolkit.fluxcd.io/image-ref: prometheus-community   # informational only; no Flux controller reads this annotation
spec:
  interval: 1h
  releaseName: prometheus-community
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=88.6.2"      # no upper limit (live: 93.3.1); major versions can change CRDs. FLUX_TODO.md #2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    defaultRules:
      # Turn off rule groups for components kubeadm doesn't expose to Prometheus (etcd,
      # controller-manager, scheduler, kube-proxy: Cilium replaces it) so they don't fire
      # "target down" alerts, plus the "general" group (Watchdog / InfoInhibitor).
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        general: false
    grafana:
      podLabels:
        app: grafana               # selected by Cilium policy monitoring-stack-ingress (HTTPS via the Ingress, mTLS from other pods)
      deploymentStrategy:
        type: Recreate             # stop the old pod first (both would use the same data/provisioning)
      initChownData:
        enabled: true              # init container chowns Grafana's data dir to uid 472
      enabled: true
      # The sidecars (which load dashboards/datasources from labelled ConfigMaps) are off:
      # everything is provisioned from files in the host folder mounted below instead.
      sidecar:
        datasources:
          enabled: false
        dashboards:
          enabled: false
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
      # Host folder with Grafana's provisioning: dashboards (JSON), datasources (Prometheus,
      # Loki) and alerting. Files must be readable by uid 472. Grafana's own /var/lib/grafana
      # is an emptyDir: anything made in the UI and not provisioned is lost on restart.
      extraVolumes:
        - name: grafana-host
          hostPath:
            path: /home/server/docker/monitoring/grafana
            type: Directory          # must already exist
      extraVolumeMounts:
        # Dashboards (JSON files)
        - name: grafana-host
          mountPath: /var/lib/grafana/dashboards
          subPath: dashboards
        # Datasources provisioning
        - name: grafana-host
          mountPath: /etc/grafana/provisioning/datasources
          subPath: provisioning/datasources
        # Dashboard provisioning configs
        - name: grafana-host
          mountPath: /etc/grafana/provisioning/dashboards
          subPath: provisioning/dashboards

        # Alert rules / contact points
        - name: grafana-host
          mountPath: /etc/grafana/provisioning/alerting
          subPath: provisioning/alerting
          readOnly: false
      admin:                       # admin login from secret.grafana.yaml (SOPS)
        existingSecret: "grafana-admin"
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: false             # Ingress is in apps/network/ingresses.yaml
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1536Mi
    prometheus:
      prometheusSpec:              # no storageSpec: the TSDB is on an emptyDir, so metrics history is lost when the pod restarts (chart default retention 10d)
        # false = scrape EVERY ServiceMonitor in the cluster, not only those labelled
        # release: prometheus-community (moved here 2026-11-17 from grafana.sidecar, where it did
        # nothing). Picks up kube-system/cilium-metrics, which is labelled release: prometheus.
        serviceMonitorSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
    alertmanager:
      alertmanagerSpec:            # only the chart's "null" receiver: alerts show in its UI/Grafana but aren't sent anywhere
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
    prometheusOperator:            # turns ServiceMonitor/PrometheusRule objects into Prometheus config
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    kube-state-metrics:            # metrics about Kubernetes objects (pod restarts, deployment replicas, ...)
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    prometheus-node-exporter:      # host metrics (CPU, memory, disks, network) from the node
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 400m
              memory: 128Mi
          prometheus:
            monitor:
              relabelings:         # add a node=<node name> label to every node-exporter series
                - action: replace
                  regex: (.+)
                  replacement: $1
                  sourceLabels:
                    - __meta_kubernetes_endpoint_node_name
                  targetLabel: node

---
# ---- prometheus-adapter: `kubectl top` / resource metrics from Prometheus -----------------
# Serves the Kubernetes resource-metrics API (metrics.k8s.io: what `kubectl top` and the
# HorizontalPodAutoscaler read) by running the PromQL queries below against Prometheus.
# (metrics-server, installed by hand with kubectl apply and never in git, was deleted 2026-11-17;
# `kubectl get apiservice v1beta1.metrics.k8s.io` points here.) metrics-reader.yaml grants read access.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-adapter
  namespace: monitoring
  annotations:
    image.toolkit.fluxcd.io/image-ref: prometheus-adapter   # informational only; no Flux controller reads this annotation
spec:
  interval: 1h
  releaseName: prometheus-adapter
  chart:
    spec:
      chart: prometheus-adapter
      version: ">=5.3.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    prometheus:
      url: http://prometheus-community-kube-prometheus.monitoring.svc   # Prometheus' Service from the release above
      port: 9090
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    rules:
      default: false               # don't install the chart's custom-metrics rules; only the resource rules below
      
      resource:
        cpu:                       # CPU = rate of CPU seconds over 3 minutes (cores in use)
          containerQuery: |
            sum by (<<.GroupBy>>) (
              rate(container_cpu_usage_seconds_total{container!="",container!="POD",<<.LabelMatchers>>}[3m])
            )
          nodeQuery: |
            sum by (<<.GroupBy>>) (
              rate(node_cpu_seconds_total{mode!="idle",mode!="iowait",mode!="steal",<<.LabelMatchers>>}[3m])
            )
          resources:
            overrides:
              node:
                resource: node
              namespace:
                resource: namespace
              pod:
                resource: pod
          containerLabel: container
        memory:                    # memory = working set (what the kernel counts against limits); node = total - free - buffers - cache
          containerQuery: |
            sum by (<<.GroupBy>>) (
              container_memory_working_set_bytes{container!="",container!="POD",<<.LabelMatchers>>}
            )
          nodeQuery: |
            sum by (<<.GroupBy>>) (
              node_memory_MemTotal_bytes{<<.LabelMatchers>>}
              - node_memory_MemFree_bytes{<<.LabelMatchers>>}
              - node_memory_Buffers_bytes{<<.LabelMatchers>>}
              - node_memory_Cached_bytes{<<.LabelMatchers>>}
            )
          resources:
            overrides:
              node:
                resource: node
              namespace:
                resource: namespace
              pod:
                resource: pod
          containerLabel: container
