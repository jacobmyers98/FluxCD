apiVersion: v1
kind: PersistentVolume
metadata:
  name: loki-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "local-storage"
  capacity:
    storage: 10Gi
  claimRef:
    name: storage-loki-0
    namespace: monitoring
  hostPath:
    path: /home/server/docker/monitoring/loki/
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain