apiVersion: v1
kind: Service
metadata:
  name: port-service-teslamate
  namespace: monitoring
  labels:
    name: teslamate
spec:
  ports:
    - name: teslamate-port
      port: 4000
      targetPort: 4000
  selector:
    app.kubernetes.io/instance: teslamate
    app.kubernetes.io/name: teslamate
  type: ClusterIP   # reached via the HTTPS Ingress; was NodePort 30012 until 2026-11-17
