apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapotter
  namespace: monitoring
  labels:
    app: snapotter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snapotter
  template:
    metadata:
      labels:
        app: snapotter
    spec:
      containers:
      - name: snapotter
        image: snapotter/snapotter:2.3.0 # {"$imagepolicy": "flux-system:snapotter-policy"}
        ports:
        - containerPort: 1349
        resources:
          requests:
            cpu: 50m
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 8Gi # installing the AI features (PyTorch etc.) was OOMKilled at 2Gi
        volumeMounts:
        - name: snapotter-data
          mountPath: /data
      volumes:
      - name: snapotter-data
        hostPath:
          path: /home/server/docker/snapotter
          type: DirectoryOrCreate

---

apiVersion: v1
kind: Service
metadata:
  name: port-service-snapotter
  namespace: monitoring
spec:
  type: ClusterIP   # reached via the HTTPS Ingress; was NodePort 30014 until 2026-11-25
  selector:
    app: snapotter
  ports:
    - protocol: TCP
      port: 1349
      targetPort: 1349