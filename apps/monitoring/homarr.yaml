apiVersion: v1
kind: Service
metadata:
  name: port-service-homarr
  namespace: monitoring
  labels:
    app: homarr
spec:
  ports:
    - name: homarr-port
      port: 7575
      targetPort: 7575
      nodePort: 30010
  selector:
    app: homarr
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr-deployment
  namespace: monitoring
  labels:
    app: homarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homarr
  template:
    metadata:
      labels:
        app: homarr
        exposed: nodeport
      annotations:
        fluxcd.io/image: "homarr-policy"
    spec:
      securityContext:
        fsGroup: 1004
      containers:
        - name: homarr
          image: ghcr.io/homarr-labs/homarr:v2.8.1 # {"$imagepolicy": "monitoring:homarr-policy"}
          imagePullPolicy: Always
          env:
            - name: SECRET_ENCRYPTION_KEY
              value: "3378b3035eedd9ee2b167720139477ace39ec8117adda382c3acfde5246e63c7"
          ports:
            - containerPort: 7575
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1536Mi
          volumeMounts:
            - mountPath: /appdata
              name: homarr-data2
            - mountPath: /app/public/icons
              name: homarr-icons
            - mountPath: /app/public/imgs/backgrounds
              name: homarr-imgs
      volumes:
        - name: homarr-data2
          hostPath:
            path: /home/server/docker/homarr/data2
            type: DirectoryOrCreate
        - name: homarr-icons
          hostPath:
            path: /home/server/docker/homarr/icons
            type: DirectoryOrCreate
        - name: homarr-imgs
          hostPath:
            path: /home/server/docker/homarr/imgs
            type: DirectoryOrCreate
