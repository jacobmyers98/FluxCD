# Helm chart sources for the monitoring HelmReleases (apps/monitoring/helmrelease.yaml).
# A HelmRepository is only "where to download charts from": Flux's source-controller
# fetches the repo's index.yaml every `interval` (6h), so a new chart version can take up
# to 6 h to be noticed (`flux reconcile source helm <name>` forces it).
# They live in flux-system so HelmReleases in any namespace can point at them.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: teslamate        # community chart (k8s-at-home / geek-cookbook) for TeslaMate
  namespace: flux-system
spec:
  interval: 6h
  url: https://geek-cookbook.github.io/charts/

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mosquitto        # t3n's Mosquitto (MQTT broker) chart, used by TeslaMate
  namespace: flux-system
spec:
  interval: 6h
  url: https://storage.googleapis.com/t3n-helm-charts
  
---

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community   # kube-prometheus-stack and prometheus-adapter
  namespace: flux-system
spec:
  interval: 6h
  url: https://prometheus-community.github.io/helm-charts
  
---

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana          # Grafana Labs' official repo: Alloy
  namespace: flux-system
spec:
  interval: 6h
  url: https://grafana.github.io/helm-charts

---

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-community   # community-maintained Grafana charts: Loki is installed from here
  namespace: flux-system
spec:
  interval: 6h
  url: https://grafana-community.github.io/helm-charts

---

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dcgm-exporter    # NVIDIA's GPU metrics exporter
  namespace: flux-system
spec:
  interval: 6h
  url: https://nvidia.github.io/dcgm-exporter/helm-charts
