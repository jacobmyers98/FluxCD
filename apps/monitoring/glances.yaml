apiVersion: apps/v1
kind: Deployment
metadata:
  name: glances
  namespace: monitoring
  labels:
    app: glances
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glances
  template:
    metadata:
      labels:
        app: glances
    spec:
      hostPID: true
      automountServiceAccountToken: false
      containers:
      - name: glances
        image: nicolargo/glances:4.5.9 # {"$imagepolicy": "flux-system:glances-policy"}
        env:
        - name: GLANCES_OPT
          value: "-w"
        ports:
        - containerPort: 61208
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: host-root
          mountPath: /host
          readOnly: true
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: port-service-glances
  namespace: monitoring
spec:
  type: ClusterIP # reached via the HTTPS Ingress; was NodePort 30015 until 2026-11-25
  selector:
    app: glances
  ports:
    - protocol: TCP
      port: 61208
      targetPort: 61208
