apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: homarr-policy
  namespace: monitoring
spec:
  imageRepositoryRef:
    name: homarr
  policy:
    semver:
      range: ">=1.45.0"

---

apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: homarr
  namespace: monitoring
spec:
  image: ghcr.io/homarr-labs/homarr
  interval: 6h
