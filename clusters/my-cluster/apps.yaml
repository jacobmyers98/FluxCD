---
# kubevirt: KubeVirt operator + KubeVirt CR (runs the dev/devbox VM). Moved here from kubevirt.yaml
# 2026-11-17. ./apps/kubevirt is in no other entry, so the operator's CRDs have exactly one owner
# (two owners could prune the CRDs and with them every VM). Upgrade one minor version at a time
# (latest patch of each minor), see apps/kubevirt/kustomization.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubevirt
  namespace: flux-system
spec:
  interval: 1h        # the manifests only change on an upgrade
  prune: true
  wait: true          # Ready only once the operator and KubeVirt CR are healthy
  timeout: 10m        # an upgrade rolls virt-api/controller/handler, which takes a while
  path: ./apps/kubevirt
  sourceRef:
    kind: GitRepository
    name: flux-system
