# One Flux Kustomization per folder in ./apps (split from the single "apps" Kustomization on
# 2026-11-17). Before, one bad manifest in any folder stopped updates for every namespace; now it
# only stops its own folder.
# (kustomize.toolkit.fluxcd.io = a Flux object, not the kustomization.yaml file format.)
# This file lives in clusters/my-cluster, which the flux-system Kustomization (made by
# `flux bootstrap`) applies, so changes here roll out within its 10 min interval
# (now: flux reconcile ks flux-system --with-source).
#
# Status: flux get ks        Force a sync of one folder: flux reconcile ks plex --with-source
#
# Shared settings on every entry:
#   interval: 1m   re-apply every minute: manual `kubectl edit`s are reverted within ~1 min
#   timeout: 5m    how long one apply may take before it counts as failed
#   prune: true    objects removed from git are deleted from the cluster
#   decryption     decrypt SOPS-encrypted secret files with the age key in secret sops-age
#                  (made by hand, see README step 2)
#
# Each folder creates its own Namespace (apps/<folder>/namespace.yaml, annotated
# kustomize.toolkit.fluxcd.io/prune: disabled so Flux never deletes one). There's no dependsOn
# between folders: on a fresh cluster, folders that write into another folder's namespace
# (network's Ingresses, arc-runner in dev) fail once and succeed on the next 1m retry.
#
# Careful: DELETING or RENAMING an entry here deletes everything that folder created (prune: true),
# e.g. removing plex deletes every app in plex (the Namespace itself stays: it's prune-protected). To move a folder or
# rename an entry, first set prune: false on it and let that roll out (check with
# kubectl -n flux-system get ks <name> -o jsonpath='{.spec.prune}'), then make the change.
#
# kubevirt (last entry) has different settings: 1h interval, wait, no SOPS. dev does NOT dependsOn
# kubevirt: that would stop n8n updates whenever KubeVirt is unhealthy (e.g. during an upgrade). On a
# fresh cluster the devbox VM fails until KubeVirt's CRDs exist, then dev succeeds on the next retry.
---
# network: cert-manager + all Ingresses and certs, Cilium policies/BGP/L2, UDM cert push
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network
  namespace: flux-system
spec:
  interval: 1m
  timeout: 5m
  path: ./apps/network
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# kube-system: GPU plugin, Tailscale, etcd + server backups, Vaultwarden
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-system
  namespace: flux-system
spec:
  interval: 1m
  timeout: 5m
  path: ./apps/kube-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
