# KubeVirt (operator + KubeVirt CR). Its own Flux Kustomization, separate from "apps", so the
# operator's CRDs are owned by exactly one Kustomization. Upgrade one minor version at a time
# (latest patch of each minor), see apps/kubevirt/kustomization.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubevirt
  namespace: flux-system
spec:
  interval: 1h
  prune: true
  wait: true
  timeout: 10m
  path: ./apps/kubevirt
  sourceRef:
    kind: GitRepository
    name: flux-system
